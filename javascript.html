  // --- Modale Globale Responsive Kanaga (Remplace alert() natif du navigateur) ---
  let customAlertCallback = null;

  function showAppModal(options) {
    if (typeof options === 'string') {
      options = { message: options };
    }
    options = options || {};
    const message = options.message || '';
    const lowMsg = message.toLowerCase();

    // Détermination intelligente du type et du titre par défaut
    let defaultType = 'warning';
    let defaultTitle = 'Attention';

    if (lowMsg.includes('erreur') || lowMsg.includes('échec') || lowMsg.includes('impossible') || lowMsg.includes('bloqué') || lowMsg.includes('invalide')) {
      defaultType = 'error';
      defaultTitle = 'Erreur';
    } else if (lowMsg.includes('succès') || lowMsg.includes('enregistré') || lowMsg.includes('félicitation') || lowMsg.includes('soumis avec succès')) {
      defaultType = 'success';
      defaultTitle = 'Succès';
    } else if (lowMsg.includes('information') || lowMsg.includes('note :')) {
      defaultType = 'info';
      defaultTitle = 'Information';
    }

    const type = options.type || defaultType;
    const title = options.title || defaultTitle;
    const btnText = options.buttonText || 'Compris';
    customAlertCallback = options.onClose || null;

    let overlay = document.getElementById('custom-app-alert-modal');
    if (!overlay) {
      setTimeout(() => showAppModal(options), 50);
      return;
    }

    const titleEl = document.getElementById('custom-modal-title');
    const msgEl = document.getElementById('custom-modal-message');
    const iconContainer = document.getElementById('custom-modal-icon-container');
    const btnEl = document.getElementById('custom-modal-btn');

    if (titleEl) titleEl.textContent = title;
    if (msgEl) msgEl.textContent = message;
    if (btnEl) btnEl.textContent = btnText;

    if (iconContainer) {
      iconContainer.className = 'custom-modal-icon-wrapper ' + type;
      if (type === 'error') {
        iconContainer.innerHTML = '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>';
      } else if (type === 'success') {
        iconContainer.innerHTML = '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>';
      } else if (type === 'info') {
        iconContainer.innerHTML = '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>';
      } else {
        // warning
        iconContainer.innerHTML = '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>';
      }
    }

    overlay.style.display = 'flex';
    requestAnimationFrame(() => {
      overlay.classList.add('active');
      if (btnEl) btnEl.focus();
    });
  }

  function closeAppModal() {
    const overlay = document.getElementById('custom-app-alert-modal');
    if (!overlay) return;
    overlay.classList.remove('active');
    setTimeout(() => {
      overlay.style.display = 'none';
      if (typeof customAlertCallback === 'function') {
        const cb = customAlertCallback;
        customAlertCallback = null;
        try { cb(); } catch(e) {}
      }
    }, 220);
  }

  function initAppModalListeners() {
    const overlay = document.getElementById('custom-app-alert-modal');
    if (overlay) {
      overlay.onclick = function(e) {
        if (e.target === overlay) closeAppModal();
      };
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initAppModalListeners);
  } else {
    initAppModalListeners();
  }

  window.addEventListener('keydown', function(e) {

      if (overlay && overlay.classList.contains('active')) {
        e.preventDefault();
        closeAppModal();
      }
    }
  });

  // --- Fonction utilitaire de mapping robuste des questions de Conclusion ---
  function matchConclusionField(qText, idx) {
    if (!qText) qText = '';
    const q = String(qText).toLowerCase().trim();
    
    // 1. Note / Performance Globale (prioritaire)
    if (q.includes('performance globale') || q.includes('note globale') || q.includes('appréciation globale') || q.includes('global rating')) {
      return 'globalRating';
    }
    // 2. Objectifs Période Passée / Écoulée / Travaux & Missions
    if (q.includes('travaux') || q.includes('mission') || (q.includes('objectif') && (q.includes('écoul') || q.includes('passé') || q.includes('bilan') || q.includes('précédent')))) {
      return 'pastGoals';
    }
    // 3. Objectifs Période Suivante / Futurs / SMART
    if (q.includes('smart') || (q.includes('objectif') && (q.includes('prochain') || q.includes('suivant') || q.includes('futur') || q.includes('à venir')))) {
      return 'smartGoals';
    }
    // 4. Points Forts
    if ((q.includes('point') && q.includes('fort')) || q.includes('forces') || q.includes('succès') || q.includes('atout')) {
      return 'strengths';
    }
    // 5. Axes d'Amélioration
    if (q.includes('amélior') || q.includes('progrès') || q.includes('perfectionn')) {
      return 'improvements';
    }
    // 6. Besoins en Formation
    if (q.includes('formation')) {
      return 'training';
    }
    // 7. Aspirations Professionnelles
    if (q.includes('aspiration') || q.includes('carrière') || q.includes('mobilité')) {
      return 'aspirations';
    }
    // 8. Commentaires (uniquement si ce n'est PAS un objectif)
    if ((q.includes('commentaire') || q.includes('remarque') || q.includes('observation')) && !q.includes('objectif')) {
      return 'empComments';
    }

    // Fallback par position si les intitulés sont complètement personnalisés
    if (idx === 0) return 'globalRating';
    if (idx === 1) return 'pastGoals';
    if (idx === 2) return 'strengths';
    if (idx === 3) return 'improvements';
    if (idx === 4) return 'training';
    if (idx === 5) return 'smartGoals';
    if (idx === 6) return 'aspirations';
    if (idx === 7) return 'empComments';

    return null;
  }

  // --- Auto Logout System ---
  let inactivityTimeout;
  const INACTIVITY_LIMIT = 30 * 60 * 1000; // 30 minutes

  function resetInactivityTimer() {
    if (!currentUser) return; // Seulement si connecté
    clearTimeout(inactivityTimeout);
    inactivityTimeout = setTimeout(function() {
      alert("Vous avez été déconnecté suite à une période d'inactivité.");
      if (typeof handleLogout === 'function') {
        handleLogout();
      } else {
        handleSessionExpired("Vous avez été déconnecté suite à une période d'inactivité.");
      }
    }, INACTIVITY_LIMIT);
  }

  function handleSessionExpired(message) {
    if (inactivityTimeout) clearTimeout(inactivityTimeout);
    if (window.kanagaToken) {
      try {
        google.script.run.logout(window.kanagaToken);
      } catch(e) {}
    }
    localStorage.removeItem('kanagaUser');
    localStorage.removeItem('kanagaToken');
    try { sessionStorage.removeItem('kanaga_cached_evals'); } catch(e) {}
    window.loadedEvals = null;
    window.kanagaToken = null;
    currentUser = null;

    const globalLoader = document.getElementById('global-loader');
    if (globalLoader) globalLoader.style.display = 'none';

    const authContent = document.getElementById('auth-content');
    if (authContent) authContent.style.display = 'none';

    const topNavbar = document.getElementById('top-navbar');
    if (topNavbar) topNavbar.style.display = 'none';

    const loginView = document.getElementById('view-login');
    if (loginView) loginView.style.display = 'block';

    const errorMsg = document.getElementById('login-error');
    if (errorMsg) {
      errorMsg.textContent = message || "Votre session a expiré. Veuillez vous reconnecter.";
      errorMsg.style.display = 'block';
    }
  }

  function handleApiError(err, contextLabel) {
    const errMsg = (err && err.message) ? err.message : String(err || '');
    if (errMsg.includes('Session invalide') || errMsg.includes('Session expirée') || errMsg.includes('Session corrompue') || errMsg.includes('Aucun jeton de session')) {
      alert("Votre session a expiré. Veuillez vous reconnecter.");
      handleSessionExpired("Votre session a expiré. Veuillez vous reconnecter.");
      return true;
    }
    if (contextLabel) {
      console.error(contextLabel + " : " + errMsg);
    }
    return false;
  }
  function isUserAdmin(user) {
    let u = user || currentUser;
    if (!u) {
      try {
        const stored = localStorage.getItem('kanagaUser');
        if (stored) {
          u = JSON.parse(stored);
          if (!currentUser) currentUser = u;
        }
      } catch(e) {}
    }
    if (!u) return false;
    const email = String(u.username || '').toLowerCase().trim();
    if (email === 'mhdicko@kanagaconsulting.com') return true;
    const role = String(u.role || '').toLowerCase().trim();
    return role === 'admin' || role === 'administrateur' || role === 'superadmin';
  }

  function isUserManagerOrAdmin(user) {
    let u = user || currentUser;
    if (!u) {
      try {
        const stored = localStorage.getItem('kanagaUser');
        if (stored) {
          u = JSON.parse(stored);
          if (!currentUser) currentUser = u;
        }
      } catch(e) {}
    }
    if (!u) return false;
    if (isUserAdmin(u)) return true;
    const role = String(u.role || '').toLowerCase().trim();
    return role === 'manager' || role === 'directeur';
  }

  function getDropdownDataFromCache() {
    return new Promise((resolve, reject) => {
      const cacheTime = localStorage.getItem('kanagaDropdownTime_v2');
      const cacheData = localStorage.getItem('kanagaDropdownData_v2');
      const now = new Date().getTime();
      
      if (cacheTime && cacheData && (now - parseInt(cacheTime)) < 60 * 60 * 1000) { 
        resolve(JSON.parse(cacheData));
      } else {
        google.script.run
          .withSuccessHandler(data => {
            localStorage.setItem('kanagaDropdownTime_v2', now.toString());
            localStorage.setItem('kanagaDropdownData_v2', JSON.stringify(data));
            resolve(data);
          })
          .withFailureHandler(reject)
          .getOdooData(window.kanagaToken);
      }
    });
  }

  // --- Device & Geolocation Detection for Security Logs ---
  window.cachedClientInfo = null;

  function getClientDeviceAndLocationInfo() {
    return new Promise(function(resolve) {
      if (window.cachedClientInfo) {
        return resolve(window.cachedClientInfo);
      }

      // 1. Détection de l'appareil (Device)
      const ua = navigator.userAgent || '';
      let deviceType = "Desktop";
      if (/tablet|ipad|playbook|silk/i.test(ua)) {
        deviceType = "Tablette";
      } else if (/mobile|iphone|ipod|android|blackberry|mini|windows\sce|palm/i.test(ua)) {
        deviceType = "Mobile";
      }

      // Détection du Système d'Exploitation (OS)
      let os = "Inconnu";
      if (/windows nt 10/i.test(ua)) os = "Windows 10/11";
      else if (/windows nt 6\.3/i.test(ua)) os = "Windows 8.1";
      else if (/windows nt 6\.1/i.test(ua)) os = "Windows 7";
      else if (/windows/i.test(ua)) os = "Windows";
      else if (/macintosh|mac os x/i.test(ua)) os = "macOS";
      else if (/iphone|ipad|ipod/i.test(ua)) os = "iOS";
      else if (/android/i.test(ua)) os = "Android";
      else if (/linux/i.test(ua)) os = "Linux";

      // Détection du Navigateur
      let browser = "Inconnu";
      if (/edg/i.test(ua)) browser = "Edge";
      else if (/opr|opera/i.test(ua)) browser = "Opera";
      else if (/chrome|crios/i.test(ua)) browser = "Chrome";
      else if (/firefox|fxios/i.test(ua)) browser = "Firefox";
      else if (/safari/i.test(ua) && !/chrome/i.test(ua)) browser = "Safari";
      else if (/trident|msie/i.test(ua)) browser = "Internet Explorer";

      let timezone = "";
      try {
        timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
      } catch (e) {}

      const screenInfo = (window.screen && window.screen.width) ? `${window.screen.width}x${window.screen.height}` : "";

      const clientData = {
        device: `${deviceType} (${os})`,
        browser: browser,
        screen: screenInfo,
        timezone: timezone,
        ip: "",
        location: ""
      };

      // 2. Récupération rapide de l'IP publique et géolocalisation
      const timeoutMs = 1200; // 1.2s max pour ne jamais ralentir l'utilisateur
      const timeoutPromise = new Promise(function(_, reject) {
        setTimeout(function() { reject(new Error('Timeout')); }, timeoutMs);
      });

      Promise.race([
        fetch('https://freeipapi.com/api/json').then(function(r) { return r.json(); }),
        timeoutPromise
      ]).then(function(ipRes) {
        if (ipRes && (ipRes.ipAddress || ipRes.ip)) {
          clientData.ip = ipRes.ipAddress || ipRes.ip;
          const locParts = [ipRes.cityName || ipRes.city, ipRes.countryName || ipRes.country].filter(Boolean);
          if (locParts.length > 0) clientData.location = locParts.join(', ');
        }
        window.cachedClientInfo = clientData;
        resolve(clientData);
      }).catch(function() {
        // En cas de timeout ou blocage réseau (adblocker/firewall), fallback rapide sur ipify
        Promise.race([
          fetch('https://api.ipify.org?format=json').then(function(r) { return r.json(); }),
          new Promise(function(_, reject) { setTimeout(function() { reject(new Error('Timeout')); }, 800); })
        ]).then(function(ipifyRes) {
          if (ipifyRes && ipifyRes.ip) {
            clientData.ip = ipifyRes.ip;
            if (timezone) clientData.location = timezone;
          }
          window.cachedClientInfo = clientData;
          resolve(clientData);
        }).catch(function() {
          clientData.ip = "Non détectée";
          if (timezone) clientData.location = timezone;
          window.cachedClientInfo = clientData;
          resolve(clientData);
        });
      });
    });
  }

  // --- Authentication Logic ---
  async function handleLoginSubmit(e) {
    e.preventDefault();
    const btnText = document.querySelector('#login-btn .btn-text');
    const btnLoader = document.querySelector('#login-btn .btn-loader');
    const errorMsg = document.getElementById('login-error');
    
    btnText.style.display = 'none';
    btnLoader.style.display = 'inline-block';
    errorMsg.style.display = 'none';

    const username = document.getElementById('login-username').value;
    const password = document.getElementById('login-password').value;

    let clientInfo = window.cachedClientInfo;
    if (!clientInfo) {
      try {
        clientInfo = await getClientDeviceAndLocationInfo();
      } catch (err) {
        clientInfo = { device: "Inconnu", browser: "Inconnu" };
      }
    }

    google.script.run
      .withSuccessHandler(res => {
        btnText.style.display = 'inline';
        btnLoader.style.display = 'none';
        
        if (res.success) {
          currentUser = res.user;
          localStorage.setItem('kanagaUser', JSON.stringify(currentUser));
          localStorage.setItem('kanagaToken', res.token);
          window.kanagaToken = res.token;
          initAuthenticatedApp(currentUser);
        } else {
          errorMsg.textContent = res.message || "Identifiants incorrects.";
          errorMsg.style.display = 'block';
        }
      })
      .withFailureHandler(err => {
        btnText.style.display = 'inline';
        btnLoader.style.display = 'none';
        errorMsg.textContent = "Erreur serveur : " + err.message;
        errorMsg.style.display = 'block';
      })
      .authenticateUser(username, password, clientInfo);
  }

  function loadEvaluationNotificationSettings() {

  function toggleReminderTrigger(enable) {
    const btnSetup = document.getElementById('btn-setup-reminder-trigger');
    const btnRemove = document.getElementById('btn-remove-reminder-trigger');
    const status = document.getElementById('eval-reminder-ctrl-status');

    if (btnSetup) btnSetup.disabled = true;
    if (btnRemove) btnRemove.disabled = true;
    if (status) {
      status.innerText = enable ? "⏳ Activation du déclencheur 8h00..." : "⏳ Désactivation du déclencheur...";
      status.style.color = "var(--primary-color)";
    }

    const handler = function(res) {
      if (btnSetup) btnSetup.disabled = false;
      if (btnRemove) btnRemove.disabled = false;
      if (status) {
        status.innerText = "" + (res.message || "Opération terminée.");
        status.style.color = (res && res.success ? "green" : "#B45309");
        setTimeout(() => { if (status) status.innerText = ""; }, 6000);
      }
      fetchReminderTriggerStatus();
    };

    const failHandler = function(err) {
      if (btnSetup) btnSetup.disabled = false;
      if (btnRemove) btnRemove.disabled = false;
      if (status) {
        status.innerText = "Erreur déclencheur : " + err.message;
        status.style.color = "red";
      }
    };

    if (enable) {
      google.script.run.withSuccessHandler(handler).withFailureHandler(failHandler).setupEvaluationReminderTrigger(window.kanagaToken);
    } else {
      google.script.run.withSuccessHandler(handler).withFailureHandler(failHandler).removeEvaluationReminderTrigger(window.kanagaToken);
    }
  }

  function populateProjectDropdowns() {

  function updateTaskDropdown(projectElementId, taskElementId, subTaskElementId) {
    const projectSelect = document.getElementById(projectElementId);
    const taskSelect = document.getElementById(taskElementId);
    const selectedProject = projectSelect.value;
    const rawTasks = projectData[selectedProject] || [];
    
    if (subTaskElementId) {
       const subTaskGroup = document.getElementById(subTaskElementId + '-group');
       if (subTaskGroup) subTaskGroup.style.display = 'none';
    }
    
    const checkboxId = (taskElementId === 'task') ? 'hide-completed-tasks' : 'edit-hide-completed-tasks';
    const checkbox = document.getElementById(checkboxId);
    const hideCompleted = checkbox ? checkbox.checked : false;

    const tasks = rawTasks
      .filter(t => {
        const isCompleted = (typeof t === 'object' && t !== null) ? t.isCompleted : false;
        if (hideCompleted && isCompleted) return false;
        const parentId = (typeof t === 'object' && t !== null) ? t.parentId : null;
        return !parentId || parentId === '' || parentId === 'False' || parentId === 'false'; // only root tasks
      })
      .map(t => (typeof t === 'object' && t !== null) ? t.name : t)
      .sort((a, b) => (a || '').localeCompare(b || ''));

    const choicesKey = (taskElementId === 'task') ? 'task' : 'editTask';

    if (!choicesInstances[choicesKey]) {
      choicesInstances[choicesKey] = new Choices(taskSelect, { placeholder: true, placeholderValue: 'Sélectionnez une tâche' });
      taskSelect.addEventListener('change', () => {
         if (subTaskElementId) updateSubTaskDropdown(projectElementId, taskElementId, subTaskElementId);
      });
    }
    
    choicesInstances[choicesKey].setChoices(
      [{ value: '', label: 'Aucune' }].concat(tasks.map(t => ({ value: t, label: t }))),
      'value', 'label', true
    );
    
    if (subTaskElementId) updateSubTaskDropdown(projectElementId, taskElementId, subTaskElementId);
  }

  function updateSubTaskDropdown(projectElementId, taskElementId, subTaskElementId) {
    if (!subTaskElementId) return;
    const projectSelect = document.getElementById(projectElementId);
    const taskSelect = document.getElementById(taskElementId);
    const subTaskSelect = document.getElementById(subTaskElementId);
    const subTaskGroup = document.getElementById(subTaskElementId + '-group');
    
    const choicesKeyTask = (taskElementId === 'task') ? 'task' : 'editTask';
    const selectedProject = projectSelect.value;
    const selectedTaskName = choicesInstances[choicesKeyTask] ? choicesInstances[choicesKeyTask].getValue(true) : taskSelect.value;
    
    const rawTasks = projectData[selectedProject] || [];
    const parentTaskObj = rawTasks.find(t => (typeof t === 'object' && t !== null) && t.name === selectedTaskName);
    const parentTaskId = parentTaskObj ? parentTaskObj.id : null;
    
    const checkboxId = (taskElementId === 'task') ? 'hide-completed-tasks' : 'edit-hide-completed-tasks';
    const checkbox = document.getElementById(checkboxId);
    const hideCompleted = checkbox ? checkbox.checked : false;

    const subTasks = rawTasks
      .filter(t => {
        const isCompleted = (typeof t === 'object' && t !== null) ? t.isCompleted : false;
        if (hideCompleted && isCompleted) return false;
        const tParentId = (typeof t === 'object' && t !== null) ? t.parentId : null;
        return tParentId && parentTaskId && String(tParentId) === String(parentTaskId);
      })
      .map(t => (typeof t === 'object' && t !== null) ? t.name : t)
      .sort((a, b) => (a || '').localeCompare(b || ''));

    const choicesKey = (subTaskElementId === 'sub-task') ? 'subTask' : 'editSubTask';

    if (subTasks.length > 0) {
        subTaskGroup.style.display = 'block';
        if (!choicesInstances[choicesKey]) {
            choicesInstances[choicesKey] = new Choices(subTaskSelect, { placeholder: true, placeholderValue: 'Sélectionnez une sous-tâche' });
        }
        choicesInstances[choicesKey].setChoices(
            [{ value: '', label: 'Aucune' }].concat(subTasks.map(t => ({ value: t, label: t }))),
            'value', 'label', true
        );
    } else {
        subTaskGroup.style.display = 'none';
        if (choicesInstances[choicesKey]) {
            choicesInstances[choicesKey].setChoices([{ value: '', label: 'Aucune' }], 'value', 'label', true);
        }
    }
  }

    if (data.error || !Array.isArray(data)) {
        tableBody.innerHTML = `<tr><td colspan="6">Erreur: ${data.error || 'Données invalides.'}</td></tr>`;
        return;
    }
    if (data.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Aucune entrée pour cette semaine.</td></tr>';
        return;
    }

    data.forEach(entry => {
        const entryDate = new Date(entry.date);
        const dateForInput = entryDate.toISOString().split('T')[0];
        
        // Check for sub-task
        const isSubtask = entry.task && entry.task.includes(" > ");
        const taskText = isSubtask ? entry.task.split(" > ").pop().trim() : (entry.task ? entry.task.replace("↳", "").trim() : '');

        // List View
        const newRow = tableBody.insertRow();
        newRow.insertCell().textContent = entryDate.toLocaleDateString('fr-FR');
        newRow.insertCell().textContent = entry.project;
        
        const taskCell = newRow.insertCell();
        taskCell.appendChild(document.createTextNode(entry.task || ''));
        
        newRow.insertCell().textContent = entry.description;
        newRow.insertCell().textContent = entry.duration + 'h';
        
        const actionsCell = newRow.insertCell();
        actionsCell.className = 'actions-cell';
        actionsCell.innerHTML = `
          <button class="edit-btn" onclick='openEditModal(${JSON.stringify(entry).replace(/'/g, "&#39;")}, "${dateForInput}")'>Modifier</button>
          <button class="delete-btn" onclick="handleDelete('${entry.rowId}')">Supprimer</button>
        `;
        
        // Calendar View
        const dayOfWeek = entryDate.getDay();
        const dayCell = document.getElementById('day-' + dayOfWeek);
        if (dayCell) {
          const entryBlock = document.createElement('div');
          entryBlock.className = 'entry-block';
          
          let taskHTML = '';
          if (entry.task) {
              const safeTask = (entry.task || '').replace(/</g, "&lt;").replace(/>/g, "&gt;");
              taskHTML = safeTask + ': ';
          }
          
          const safeDesc = (entry.description || '').replace(/</g, "&lt;").replace(/>/g, "&gt;");
          entryBlock.innerHTML = `<strong>${(entry.project||'').replace(/</g, "&lt;")}</strong> <span class="duration">${entry.duration}h</span><span class="description">${taskHTML}${safeDesc}</span>`;
          dayCell.appendChild(entryBlock);
        }
    });
  }

  function findProfileQuestions(profileName) {
    if (!evalQuestions || !profileName) return null;
    const target = profileName.toLowerCase().trim();
    for (const key in evalQuestions) {
      if (key.toLowerCase().trim() === target) {
        return evalQuestions[key];
      }
    }
    return null;
  }

  function getCachedEvaluations() {
    if (window.loadedEvals && Array.isArray(window.loadedEvals)) {
      return window.loadedEvals;
    }
    try {
      const cached = sessionStorage.getItem('kanaga_cached_evals');
      if (cached) {
        const parsed = JSON.parse(cached);
        if (Array.isArray(parsed)) {
          window.loadedEvals = parsed;
          return parsed;
        }
      }
    } catch(e) {}
    return null;
  }

  function updateEvaluationsCache(evalsData) {
    let parsed = evalsData;
    if (typeof evalsData === 'string') {
      try {
        parsed = JSON.parse(evalsData);
      } catch(e) {
        parsed = [];
      }
    }
    if (Array.isArray(parsed)) {
      window.loadedEvals = parsed;
      try {
        sessionStorage.setItem('kanaga_cached_evals', JSON.stringify(parsed));
      } catch(e) {}
    }

    // Mettre à jour l'écran actif sans changer d'écran
    if (window.evalCurrentScreen === 'selection') {
      renderPendingEvaluationsCard(false);
    } else if (window.evalCurrentScreen === 'employee-dashboard') {
      renderEmployeeDashboardTable(parsed);
      const loader = document.getElementById('eval-dashboard-loader');
      if (loader) loader.style.display = 'none';
    } else if (window.evalCurrentScreen === 'manager-dashboard') {

    if (window.evalCurrentScreen !== 'selection') return;

    const evals = getCachedEvaluations();

        <div class="panel" style="border: 1px solid #E2D9C8; background: #FAF9F6; min-height: 120px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 8px; border-radius: 8px; box-shadow: var(--shadow-sm); animation: fadeIn 0.2s ease-in-out;">

          </div>
        </div>
      `;
      return;
    }

    if (!evals || !currentUser) {
      if (!isLoading) {
        pendingContainer.style.display = 'none';
        pendingContainer.innerHTML = '';
      }
      return;
    }

    const uEmail = (currentUser.username || '').toLowerCase().trim();
    const uName = (currentUser.fullName || '').toLowerCase().trim();

    const pendingAutoEvals = evals.filter(ev => {
      const empEmail = (ev.employeeEmail || '').toLowerCase().trim();
      const empName = (ev.employeeName || '').toLowerCase().trim();
      return (empEmail === uEmail || empName === uName) && (ev.status === 'Initiée' || ev.status === 'Brouillon Employé');
    });

    const pendingSecondaryEvals = evals.filter(ev => {
      if (ev.status !== 'Attente Évaluateur Secondaire') return false;
      let secList = [];
      try { secList = JSON.parse(ev.secondaryEvaluators || '[]'); } catch(e){}
      const entry = secList.find(s => (s.email || '').toLowerCase().trim() === uEmail || (s.name || '').toLowerCase().trim() === uName);
      return entry && entry.status !== 'Complété';
    });

    const pendingManagerEvals = evals.filter(ev => {
      if (ev.status !== 'Attente Évaluateur Principal' && ev.status !== 'Auto-évaluée' && ev.status !== 'Pré-évaluée' && ev.status !== 'Brouillon Manager') return false;
      const princEmail = (ev.principalEvaluatorEmail || '').toLowerCase().trim();
      const princName = (ev.principalEvaluatorName || ev.evaluatorName || '').toLowerCase().trim();
      return (princEmail === uEmail || princName === uName);

    const totalPending = pendingAutoEvals.length + pendingSecondaryEvals.length + pendingManagerEvals.length;
    if (totalPending > 0) {

        <div class="panel" style="border: 2px solid var(--secondary-color); background: #fdfdfd; animation: fadeIn 0.25s ease-in-out;">
          <h3 style="color: var(--secondary-color);">Action Requise</h3>
          <p class="text-muted" style="margin-bottom:15px; font-size:14px;">Vous avez ${totalPending} action(s) d'évaluation en attente de votre intervention.</p>
      `;
      pendingAutoEvals.forEach(ev => {
        const isDraft = (ev.status === 'Brouillon Employé');
        html += `<button class="btn btn-primary" onclick="startEvaluationWizard('Auto-évaluation', ${ev.rowId})" style="width: 100%; margin-bottom: 10px; background-color: var(--secondary-color);">${isDraft ? 'Continuer mon auto-évaluation (Brouillon)' : 'Auto-évaluer'} (${escapeHtml(ev.period)})</button>`;
      });
      pendingSecondaryEvals.forEach(ev => {
        let secList = [];
        try { secList = JSON.parse(ev.secondaryEvaluators || '[]'); } catch(e){}
        const entry = secList.find(s => (s.email || '').toLowerCase().trim() === uEmail || (s.name || '').toLowerCase().trim() === uName);
        const isDraft = entry && entry.status === 'Brouillon';
        html += `<button class="btn" onclick="startEvaluationWizard('Évaluation Secondaire', ${ev.rowId})" style="width: 100%; margin-bottom: 10px; background-color: #ff9800; color: #fff;">${isDraft ? 'Continuer évaluation secondaire (Brouillon)' : 'Évaluation secondaire'} : ${escapeHtml(ev.employeeName)} (${escapeHtml(ev.period)})</button>`;
      });
      pendingManagerEvals.forEach(ev => {
        const isDraft = (ev.status === 'Brouillon Manager');
        html += `<button class="btn" onclick="startEvaluationWizard('Évaluation Manager', ${ev.rowId})" style="width: 100%; margin-bottom: 10px; background-color: #2196F3; color: #fff;">${isDraft ? 'Continuer évaluation manager (Brouillon)' : 'Évaluation manager'} : ${escapeHtml(ev.employeeName)} (${escapeHtml(ev.period)})</button>`;
      });
      html += `</div>`;
      pendingContainer.innerHTML = html;
    } else {
      pendingContainer.style.display = 'none';
      pendingContainer.innerHTML = '';
    }
  }

  function deduceLastFilledPosition() {
    // 1. Si on a des informations explicites de navigation sauvegardées
    if (window.evalLastDraftNav && window.evalLastDraftNav.step) {
      return window.evalLastDraftNav;
    }

    const profile = (window.evalCurrentEv && window.evalCurrentEv.profile) ? window.evalCurrentEv.profile : document.getElementById('eval-profile-select').value;
    const specQuestions = (profile && profile !== 'Autre') ? findProfileQuestions(profile) : null;
    const hasSpecQuestions = specQuestions && specQuestions.length > 0;

    // 2. Vérifier si des questions de la conclusion ont été répondues
    const concQuestions = (evalQuestions && evalQuestions.conclusion) ? evalQuestions.conclusion : [];
    let lastConcPage = 1;
    let hasConcAnswers = false;
    concQuestions.forEach((q, idx) => {
      if (q.type === 'section') return;
      const page = parseInt(q.page, 10) || 1;
      let answered = false;
      if (q.type === 'text') {
        const val = document.querySelector(`textarea[name="conclusion_q${idx}"]`)?.value || '';
        if (val.trim()) answered = true;
      } else {
        const checked = document.querySelector(`input[name="conclusion_q${idx}"]:checked`);
        if (checked && checked.value) answered = true;
      }
      if (answered) {
        hasConcAnswers = true;
        if (page > lastConcPage) lastConcPage = page;
      }
    });

    const hasAnyGeneralField = ['eval-past-goals', 'eval-strengths', 'eval-improvements', 'eval-global-rating', 'eval-training', 'eval-smart-goals', 'eval-aspirations', 'eval-emp-comments'].some(id => {
      const el = document.getElementById(id);
      return el && el.value && el.value.trim() !== '';
    });

    if (hasConcAnswers || hasAnyGeneralField) {
      return { step: 4, specPage: 1, conclusionPage: lastConcPage };
    }

    // 3. Vérifier si des questions de la section spécifique (profil) ont été répondues
    if (hasSpecQuestions) {
      let lastSpecPage = 1;
      let hasSpecAnswers = false;
      specQuestions.forEach((q, idx) => {
        if (q.type === 'section') return;
        const page = parseInt(q.page, 10) || 1;
        let answered = false;
        if (q.type === 'text') {
          const val = document.querySelector(`textarea[name="spec_q${idx}"]`)?.value || '';
          if (val.trim()) answered = true;
        } else {
          const checked = document.querySelector(`input[name="spec_q${idx}"]:checked`);
          if (checked && checked.value) answered = true;
        }
        if (answered) {
          hasSpecAnswers = true;
          if (page > lastSpecPage) lastSpecPage = page;
        }
      });

      if (hasSpecAnswers) {
        return { step: 3, specPage: lastSpecPage, conclusionPage: 1 };
      }
    }

    // 4. Par défaut : Tronc commun (Étape 2)
    return { step: 2, specPage: 1, conclusionPage: 1 };
  }

  function navigateToDraftResumePosition(pos) {
    if (!pos || !pos.step) {
      showEvalStep(2);
      return;
    }

    const profile = (window.evalCurrentEv && window.evalCurrentEv.profile) ? window.evalCurrentEv.profile : document.getElementById('eval-profile-select').value;
    const specQuestions = (profile && profile !== 'Autre') ? findProfileQuestions(profile) : null;
    const hasSpec = specQuestions && specQuestions.length > 0;

    let targetStep = pos.step;
    if (targetStep === 3 && !hasSpec) {
      targetStep = 4;
    }

    if (targetStep === 4) {
      document.getElementById('step-nav-3').style.display = hasSpec ? 'inline-block' : 'none';
      document.getElementById('step-nav-4').style.display = 'inline-block';
      window.evalCurrentConclusionPage = pos.conclusionPage || 1;
      updateConclusionPageView();
      showEvalStep(4);
      notifyPageChanged(
        "Reprise de votre brouillon",
        "Vous avez été repositionné automatiquement sur votre dernière étape (Section 3 : Conclusion)."
      );
    } else if (targetStep === 3) {
      document.getElementById('step-nav-3').style.display = 'inline-block';
      window.evalCurrentSpecPage = pos.specPage || 1;
      updateSpecPageView();
      showEvalStep(3);
      notifyPageChanged(
        "Reprise de votre brouillon",
        "Vous avez été repositionné automatiquement sur votre dernière étape (Section 2 : Profil)."
      );
    } else {
      showEvalStep(2);
    }
  }

  function startEvaluationWizard(type, attachedRowId = null) {
    // 1. Vérifier si les questions d'évaluation sont bien chargées avant d'ouvrir le wizard
    if (!evalQuestions || Object.keys(evalQuestions).length === 0 || !evalQuestions.fondamentales || evalQuestions.fondamentales.length === 0) {
       const statusDiv = document.getElementById('eval-submit-status');
       if (statusDiv) {
         statusDiv.style.display = 'block';
         statusDiv.style.background = '#FFF8E1';
         statusDiv.style.color = '#795548';
         statusDiv.style.border = '1px solid #FFE082';
         statusDiv.innerHTML = "⏳ <strong>Chargement du questionnaire en cours...</strong> Veuillez patienter.";
       }
       google.script.run
         .withSuccessHandler(function(config) {
            evalQuestions = normalizeEvalConfig(config || {});
            // Populer le sélecteur de profils si vide
            const select = document.getElementById('eval-profile-select');
            if (select) {
              const defaultOption = (select.options && select.options[0]) ? select.options[0] : new Option("-- Choisir le profil --", "");
              select.innerHTML = '';
              select.appendChild(defaultOption);
              for (const key in config) {
                 if (key.toLowerCase() !== 'fondamentales' && key.toLowerCase() !== 'conclusion' && key !== '_stepTitles') {
                    const opt = document.createElement('option');
                    opt.value = key;
                    opt.text = "Profil : " + key;
                    select.appendChild(opt);
                 }
              }
              const autreOpt = document.createElement('option');
              autreOpt.value = "Autre";
              autreOpt.text = "Autre profil (aucun profil spécifique)";
              select.appendChild(autreOpt);
            }
            if (statusDiv) statusDiv.style.display = 'none';
            startEvaluationWizard(type, attachedRowId);
         })
         .withFailureHandler(function(err) {
            if (statusDiv) {
              statusDiv.style.background = '#ffebee';
              statusDiv.style.color = '#c62828';
              statusDiv.style.border = '1px solid #ffcdd2';
              statusDiv.innerHTML = "<strong>Erreur critique :</strong> Impossible de charger le questionnaire (" + escapeHtml(err.message) + ").";
            }
            alert("Erreur critique : Impossible de charger le questionnaire d'évaluation (" + err.message + "). Veuillez vérifier votre connexion ou recharger la page.");
         })
         .getEvaluationConfig(window.kanagaToken);
       return;
    }

                  if (cEl) cEl.value = comm;
                }
              } else if (q.type === 'text') {
                const t = document.querySelector(`textarea[name="conclusion_q${idx}"]`);
                if(t) t.value = ans || comm || '';
              }
            });

            btnSaveSecDraft.style.display = 'none';

  let evalToastTimer = null;
  function notifyPageChanged(title, subtitle) {
    const toast = document.getElementById('eval-page-change-toast');
    const toastTitle = document.getElementById('eval-page-change-toast-title');
    const toastSub = document.getElementById('eval-page-change-toast-sub');
    if (!toast || !toastTitle) return;

    toastTitle.textContent = title || 'Nouvelle page chargée';
    if (toastSub) {
      toastSub.textContent = subtitle || 'Les questions correspondantes ont été mises à jour ci-dessous.';
    }

    toast.style.display = 'block';
    toast.style.opacity = '1';
    toast.classList.remove('eval-page-toast');
    void toast.offsetWidth;
    toast.classList.add('eval-page-toast');

    if (evalToastTimer) clearTimeout(evalToastTimer);
    evalToastTimer = setTimeout(() => {
      if (toast) {
        toast.style.transition = 'opacity 0.6s ease';
        toast.style.opacity = '0';
        setTimeout(() => {
          if (toast && toast.style.opacity === '0') {
            toast.style.display = 'none';
            toast.style.opacity = '1';
          }
        }, 600);
      }
    }, 4000);

  function nextEvalStep(current, next) {
    if (typeof saveDraftToLocalStorage === 'function') saveDraftToLocalStorage();
    if (current === 1) {
        if (!document.getElementById('eval-period').value) {
            alert('Veuillez renseigner la période d\'évaluation.');
            return;
        }
        if (window.evalCurrentMode === 'Initiation') {
            if (!document.getElementById('eval-employee-email').value) {
                alert('Veuillez sélectionner au moins un collaborateur.');
                return;
            }
            if (!document.getElementById('eval-principal-evaluator').value) {
                alert('Veuillez désigner un évaluateur principal.');
                return;
            }
        } else {
            const fondaQuestions = (evalQuestions && evalQuestions.fondamentales) ? evalQuestions.fondamentales : [];
            if (!fondaQuestions || fondaQuestions.length === 0) {
                alert("Erreur critique : Les questions du questionnaire ne sont pas chargées. Veuillez recharger la page.");
                return;
            }
        }
    }
    if (current === 2) {
        const fondaQuestions = (evalQuestions && evalQuestions.fondamentales) ? evalQuestions.fondamentales : [];
        if (!fondaQuestions || fondaQuestions.length === 0) {
            alert("Erreur critique : Les questions du tronc commun ne sont pas disponibles. Veuillez rafraîchir la page.");
            return;
        }
        if (!validateSectionQuestions('fonda', fondaQuestions)) {
            alert('Veuillez répondre à toutes les questions obligatoires du tronc commun avant de passer à la suite.');
            return;
        }

        const profile = (window.evalCurrentEv && window.evalCurrentEv.profile) ? window.evalCurrentEv.profile : document.getElementById('eval-profile-select').value;
        if (!profile) {
            alert('Veuillez sélectionner un profil.');
            return;
        }
        const specQuestions = (profile !== 'Autre') ? findProfileQuestions(profile) : null;
        if (!specQuestions || specQuestions.length === 0 || profile === 'Autre') {
            next = 4; // Aiguillage: pas de questions spécifiques, saut direct vers la Section 3
        } else if(window.evalCurrentMode !== 'Initiation') {
            const specGrid = document.getElementById('grid-specifiques');
            const alreadyGenerated = specGrid && specGrid.getAttribute('data-profile') === profile && specGrid.children.length > 0;
            if (!alreadyGenerated) {
                generateGrid('grid-specifiques', 'spec', specQuestions);
                if (specGrid) specGrid.setAttribute('data-profile', profile);
                if (typeof restoreLocalDraftIfExists === 'function') {
                    restoreLocalDraftIfExists(window.evalAttachedRowId, window.evalCurrentMode);
                }
            }
            document.getElementById('step-3-title').innerText = "Section 2 : Aiguillage - " + profile;
            document.getElementById('step-nav-3').style.display = 'inline-block';
            if (!window.evalCurrentSpecPage) window.evalCurrentSpecPage = 1;
            updateSpecPageView();
        }
    }
    if (current === 3 && next === 4) {
        const profile = (window.evalCurrentEv && window.evalCurrentEv.profile) ? window.evalCurrentEv.profile : document.getElementById('eval-profile-select').value;
        const specQuestions = (profile !== 'Autre') ? findProfileQuestions(profile) : null;
        if (specQuestions && specQuestions.length > 0) {
            if (!validateSectionQuestions('spec', specQuestions, window.evalCurrentSpecPage)) {
                alert('Veuillez répondre à toutes les questions obligatoires de cette page avant de continuer.');
                return;
            }
        }
    }
    if (next === 4) {
        window.evalCurrentConclusionPage = 1;
        updateConclusionPageView();
    }
    showEvalStep(next);
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')

  function normalizeRatingValue(val) {
    if (!val || typeof val !== 'string') return '';
    const s = val.trim().toUpperCase();
    if (['EXCEPTI', '5 - EXCEPTI', '5-EXCEPTI', '5', 'PE'].includes(s)) return 'EXCEPTI';
    if (['SUPERIE', '4 - SUPERIE', '4-SUPERIE', '4', 'PS'].includes(s)) return 'SUPERIE';
    if (['CONFORM', '3 - CONFORM', '3-CONFORM', '3', 'CA'].includes(s)) return 'CONFORM';
    if (['AMELIOR', '2 - AMELIOR', '2-AMELIOR', '2', 'PA'].includes(s)) return 'AMELIOR';
    if (['INSATIS', '1 - INSATIS', '1-INSATIS', '1', 'PI'].includes(s)) return 'INSATIS';
    if (['NONAPPL', 'NON APPL', 'NON-APPL', 'N/A', 'NA'].includes(s)) return 'NONAPPL';
    return '';
  }

  function setRadioAnswer(namePrefix, idx, ans) {
    if (!ans) return;
    const norm = normalizeRatingValue(ans);
    let r = document.querySelector(`input[name="${namePrefix}_q${idx}"][value="${ans}"]`) ||
            document.querySelector(`input[name="${namePrefix}_q${idx}"][value="${norm}"]`);
    if (!r) {
      const allRadios = document.querySelectorAll(`input[name="${namePrefix}_q${idx}"]`);
      for (let i = 0; i < allRadios.length; i++) {
        if (normalizeRatingValue(allRadios[i].value) === norm) {
          r = allRadios[i];
          break;
        }
      }
    }
    if (r) r.checked = true;
  }

  function getDashboardRatingBadge(val) {
    if (!val) return '<span class="text-muted">-</span>';
    const s = String(val).trim();
    if (!s || s === '-') return '<span class="text-muted">-</span>';
    const lines = s.split('\n');
    const norm = normalizeRatingValue(lines[0].trim());
    if (norm) {
      const cls = getEvalBadgeClass(norm);
      return '<span class="eval-badge eval-badge-' + cls + '">' + norm + '</span>';
    }
    return '<span class="eval-badge eval-badge-na" title="' + escapeHtml(s) + '">' + escapeHtml(s.slice(0, 20)) + (s.length > 20 ? '...' : '') + '</span>';
  }

  function getEvalBadgeClass(rating) {
    if (!rating) return 'na';
    const norm = normalizeRatingValue(rating);
    if (norm === 'EXCEPTI') return 'pe';
    if (norm === 'SUPERIE') return 'ps';
    if (norm === 'CONFORM') return 'ca';
    if (norm === 'AMELIOR') return 'pa';
    if (norm === 'INSATIS') return 'pi';
    return 'na';
  }

  function formatDashboardRating(val) {
    if (!val) return '<span class="text-muted">-</span>';

    if (!s || s === '-') return '<span class="text-muted">-</span>';
    const lines = s.split('\n');

    if (norm) {
      const cls = getEvalBadgeClass(norm);

  // --- Helper: Extraction Note & Commentaire (pour réponses préexistantes) ---
  function extractGradeAndComment(raw) {
    if (!raw) return { grade: '', comment: '' };
    const str = String(raw).trim();
    if (!str) return { grade: '', comment: '' };

    // Une note n'est reconnue QUE si la première ligne correspond exactement à une valeur du choix multiple
    const lines = str.split('\n');
    const firstNorm = normalizeRatingValue(lines[0].trim());
    if (firstNorm) {
      const rest = lines.slice(1).join('\n').trim();
      return { grade: firstNorm, comment: rest };
    }

    // Sinon, c'est purement du texte saisi : aucun badge de note, tout est commentaire
    return { grade: '', comment: str };
  }

  // --- Helper: Préparation de l'ordre de la Conclusion (Performance Globale en Question 1) ---
  function prepareConclusionQuestions(rawList) {
    if (!rawList || !Array.isArray(rawList) || rawList.length === 0) return [];

    const list = rawList.map(q => Object.assign({}, typeof q === 'string' ? { text: q, type: 'scale', page: 1 } : q));

    const globalIdx = list.findIndex((q, i) => matchConclusionField(q.text, i) === 'globalRating');
    if (globalIdx > -1) {
      const [globalQ] = list.splice(globalIdx, 1);
      globalQ.page = 1;
      globalQ.type = 'scale'; // Forcer la question en choix multiple avec échelle
      if (!globalQ.options || !globalQ.options.includes('INSATIS')) {
        globalQ.options = 'INSATIS, AMELIOR, CONFORM, SUPERIE, EXCEPTI, NONAPPL';
      }
      let cleanText = (globalQ.text || '').replace(/^\s*\d+[\.\)]\s*/, '').trim();
      if (!cleanText.toLowerCase().includes('globale')) cleanText = 'Appréciation de la Performance Globale';
      globalQ.text = '1. ' + cleanText;
      list.unshift(globalQ);
    }

    let p1Num = 2;
    list.forEach((q, idx) => {
      if (idx === 0) return;
      const page = parseInt(q.page, 10) || 1;
      if (page === 1) {
        let cleanText = (q.text || '').replace(/^\s*\d+[\.\)]\s*/, '').trim();
        q.text = p1Num + '. ' + cleanText;
        p1Num++;
      }
    });

    return list;
  }

  function normalizeEvalConfig(config) {
    if (!config) return config;
    if (config.conclusion && Array.isArray(config.conclusion)) {
      config.conclusion = prepareConclusionQuestions(config.conclusion);
    }
    return config;
  }

  // --- Helper: Synthèse des Notes Attribuées (EXCEPTI à INSATIS et NONAPPL) ---
  function calculateScoreCountsFromElements(selector) {
    const counts = {
      'EXCEPTI': 0,
      'SUPERIE': 0,
      'CONFORM': 0,
      'AMELIOR': 0,
      'INSATIS': 0,
      'NONAPPL': 0
    };
    let total = 0;
    const radios = document.querySelectorAll(selector);
    radios.forEach(r => {
      if (!r.checked) return;
      const val = (r.value || '').toUpperCase();
      if (counts.hasOwnProperty(val)) {
        counts[val]++;
        total++;
      } else if (val === 'PE' || val.includes('EXCEPTI')) { counts['EXCEPTI']++; total++; }
      else if (val === 'PS' || val.includes('SUPERIE')) { counts['SUPERIE']++; total++; }
      else if (val === 'CA' || val.includes('CONFORM')) { counts['CONFORM']++; total++; }
      else if (val === 'PA' || val.includes('AMELIOR')) { counts['AMELIOR']++; total++; }
      else if (val === 'PI' || val.includes('INSATIS')) { counts['INSATIS']++; total++; }
      else if (val === 'N/A' || val.includes('NONAPPL')) { counts['NONAPPL']++; total++; }
    });
    return { counts, total };
  }

  function calculateAutoEvalScoreCounts() {
    const ev = window.evalCurrentEv;
    if (!ev) return null;
    const counts = {
      'EXCEPTI': 0,
      'SUPERIE': 0,
      'CONFORM': 0,
      'AMELIOR': 0,
      'INSATIS': 0,
      'NONAPPL': 0
    };
    let total = 0;

    function countList(raw) {
      if (!raw) return;
      try {
        const list = typeof raw === 'string' ? JSON.parse(raw) : raw;
        if (Array.isArray(list)) {
          list.forEach(item => {
            const val = ((item && (item.answer || item.rating)) || '').toUpperCase();
            if (counts.hasOwnProperty(val)) {
              counts[val]++;
              total++;
            } else if (val === 'PE' || val.includes('EXCEPTI')) { counts['EXCEPTI']++; total++; }
            else if (val === 'PS' || val.includes('SUPERIE')) { counts['SUPERIE']++; total++; }
            else if (val === 'CA' || val.includes('CONFORM')) { counts['CONFORM']++; total++; }
            else if (val === 'PA' || val.includes('AMELIOR')) { counts['AMELIOR']++; total++; }
            else if (val === 'PI' || val.includes('INSATIS')) { counts['INSATIS']++; total++; }
            else if (val === 'N/A' || val.includes('NONAPPL')) { counts['NONAPPL']++; total++; }
          });
        }
      } catch(e) {}
    }

    countList(ev.fondamentales);
    countList(ev.specifiques);
    return total > 0 ? { counts, total } : null;
  }

  window.validateSectionQuestions = function(prefix, questionsList, pageFilter) {
    if (window.evalIsAdminOverride || (window.evalCurrentEv && window.evalCurrentEv.status === 'Complétée' && typeof isUserAdmin === 'function' && isUserAdmin())) {
      return true; // Mode Administrateur : navigation et modification libres sans obligation de remplir tous les champs
    }
    if (!questionsList || !Array.isArray(questionsList) || questionsList.length === 0) {
      if (prefix === 'fonda') return false;
      return true;
    }
    let firstInvalidRow = null;
    let allValid = true;

    questionsList.forEach((qObj, idx) => {
      const q = typeof qObj === 'string' ? { text: qObj, type: 'scale', page: 1 } : qObj;
      if (q.type === 'section') return;
      
      const qPage = parseInt(q.page, 10) || 1;
      if (pageFilter !== undefined && pageFilter !== null && qPage !== pageFilter) {
        return;
      }

      const answered = isQuestionAnswered(prefix, idx, q.type);
      if (!answered) {
        setQuestionError(prefix, idx);
        allValid = false;
        if (!firstInvalidRow) {
          firstInvalidRow = document.getElementById('row-' + prefix + '-' + idx);
        }
      } else {
        clearQuestionError(prefix, idx);
      }
    });

    if (!allValid && firstInvalidRow) {
      firstInvalidRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    return allValid;
  };

  function generateGrid(containerId, prefix, questions) {
    const container = document.getElementById(containerId);
    let html = '';
    if(!questions) return;
    questions.forEach((qObj, idx) => {
      // Pour la compatibilité arrière si d'anciens formats sont passés
      const q = typeof qObj === 'string' ? { text: qObj, type: 'scale', options: 'PI, PA, CA, PS, PE, N/A', description: "" } : qObj;
      const text = q.text.replace(/`/g, "'");
      const desc = q.description ? `<div style="font-size:12px; color:#666; margin-top:4px;">${q.description.replace(/`/g, "'")}</div>` : '';
      
      // Données existantes du collaborateur si consultation / évaluation manager
      let collabAnswer = '';
      let collabComment = '';
      if (window.evalCurrentEv) {
        try {
          let listStr = null;
          if (prefix === 'fonda') listStr = window.evalCurrentEv.fondamentales;
          else if (prefix === 'spec') listStr = window.evalCurrentEv.specifiques;
          else if (prefix === 'conclusion') listStr = window.evalCurrentEv.conclusion;

          if (listStr) {
            const parsed = JSON.parse(listStr);
            if (parsed && parsed[idx]) {
              collabAnswer = parsed[idx].answer || '';
              collabComment = parsed[idx].empComment || parsed[idx].comment || '';
            }
          } else if (prefix === 'conclusion') {
            const fieldKey = matchConclusionField(q.text, idx);
            if (fieldKey === 'pastGoals') collabAnswer = window.evalCurrentEv.pastGoals || '';
            else if (fieldKey === 'strengths') collabAnswer = window.evalCurrentEv.strengths || '';
            else if (fieldKey === 'improvements') collabAnswer = window.evalCurrentEv.improvements || '';
            else if (fieldKey === 'globalRating') {
              const rawGlob = window.evalCurrentEv.globalRating || '';
              const parsedG = extractGradeAndComment(rawGlob);
              collabAnswer = parsedG.grade;
              collabComment = parsedG.comment;
              if (window.evalCurrentEv.conclusion) {
                try {
                  const parsedConc = JSON.parse(window.evalCurrentEv.conclusion);
                  if (parsedConc && parsedConc[idx]) {
                    if (parsedConc[idx].answer) {
                      const pSub = extractGradeAndComment(parsedConc[idx].answer);
                      if (pSub.grade) collabAnswer = pSub.grade;
                      if (pSub.comment && !collabComment) collabComment = pSub.comment;
                    }
                    const ec = parsedConc[idx].empComment || parsedConc[idx].comment || '';
