<script>
  let currentUser = null;
  let projectData = {};
  let choicesInstances = { project: null, task: null, editProject: null, editTask: null };
  let evaluationData = {};

  function isUserAdmin(user) {
    let u = user || currentUser;
    if (!u) {
      try {
        const stored = localStorage.getItem('kanagaUser');
        if (stored) {
          u = JSON.parse(stored);
          if (!currentUser) currentUser = u;
        }
      } catch(e) {}
    }
    if (!u) return false;
    const email = String(u.username || '').toLowerCase().trim();
    if (email === 'mhdicko@kanagaconsulting.com') return true;
    const role = String(u.role || '').toLowerCase().trim();
    return role === 'admin' || role === 'administrateur' || role === 'superadmin';
  }

  function isUserManagerOrAdmin(user) {
    let u = user || currentUser;
    if (!u) {
      try {
        const stored = localStorage.getItem('kanagaUser');
        if (stored) {
          u = JSON.parse(stored);
          if (!currentUser) currentUser = u;
        }
      } catch(e) {}
    }
    if (!u) return false;
    if (isUserAdmin(u)) return true;
    const role = String(u.role || '').toLowerCase().trim();
    return role === 'manager' || role === 'directeur';
  }

      if (event.target == modal) { modal.style.display = "none"; }
    });
  });

  function getDropdownDataFromCache() {
    return new Promise((resolve, reject) => {
      const cacheTime = localStorage.getItem('kanagaDropdownTime_v2');
      const cacheData = localStorage.getItem('kanagaDropdownData_v2');
      const now = new Date().getTime();
      
      if (cacheTime && cacheData && (now - parseInt(cacheTime)) < 60 * 60 * 1000) { 
        resolve(JSON.parse(cacheData));
      } else {
        google.script.run
          .withSuccessHandler(data => {
            localStorage.setItem('kanagaDropdownTime_v2', now.toString());
            localStorage.setItem('kanagaDropdownData_v2', JSON.stringify(data));
            resolve(data);
          })
          .withFailureHandler(reject)
          .getOdooData(window.kanagaToken);
      }
    });
  }

  // --- Authentication Logic ---
  function handleLoginSubmit(e) {
    e.preventDefault();
    const btnText = document.querySelector('#login-btn .btn-text');
    const btnLoader = document.querySelector('#login-btn .btn-loader');
    const errorMsg = document.getElementById('login-error');
    
    btnText.style.display = 'none';
    btnLoader.style.display = 'inline-block';
    errorMsg.style.display = 'none';

    const username = document.getElementById('login-username').value;
    const password = document.getElementById('login-password').value;

    google.script.run
      .withSuccessHandler(res => {
        btnText.style.display = 'inline';
        btnLoader.style.display = 'none';
        
        if (res.success) {
          currentUser = res.user;
          localStorage.setItem('kanagaUser', JSON.stringify(currentUser));
          localStorage.setItem('kanagaToken', res.token);
          window.kanagaToken = res.token;
          initAuthenticatedApp(currentUser);
        } else {
          errorMsg.textContent = res.message || "Identifiants incorrects.";
          errorMsg.textContent = result.message || "Identifiants incorrects.";

  function loadEvaluationNotificationSettings() {
    google.script.run
      .withSuccessHandler(function(settings) {
        window.adminNotifSettings = settings || {};
        const actSelect = document.getElementById('eval-notif-activation');
        if (actSelect) {
          actSelect.value = (window.adminNotifSettings.activation || 'OUI').toUpperCase();
        }
        onNotificationEventSelectChange();
      })
      .withFailureHandler(function(err) {
        console.error("Erreur chargement notif settings: " + err.message);
      })
      .getEvaluationNotificationSettings(window.kanagaToken);
  }

  function onNotificationEventSelectChange() {
    const select = document.getElementById('eval-email-event-select');
    if (!select) return;
    const evt = select.value || 'initiation_employee';
    const settings = window.adminNotifSettings || {};

    const subjectInput = document.getElementById('eval-email-subject');
    const messageInput = document.getElementById('eval-email-message');
    const defaultTpl = DEFAULT_FRONTEND_NOTIF_TEMPLATES[evt] || {};

    if (subjectInput) {
      subjectInput.value = settings[evt + '_subject'] || defaultTpl.subject || '';
    }
    if (messageInput) {
      messageInput.value = settings[evt + '_message'] || defaultTpl.message || '';
    }
    const statusMsg = document.getElementById('eval-email-status');
    if (statusMsg) statusMsg.innerText = '';
  }

  function saveCurrentNotificationTemplate(e) {
    if (e && e.preventDefault) e.preventDefault();
    const select = document.getElementById('eval-email-event-select');
    const evt = select ? select.value : 'initiation_employee';
    const subject = document.getElementById('eval-email-subject').value;
    const message = document.getElementById('eval-email-message').value;
    const btn = document.getElementById('btn-save-eval-email');
    const statusMsg = document.getElementById('eval-email-status');

    if (!window.adminNotifSettings) window.adminNotifSettings = {};
    window.adminNotifSettings[evt + '_subject'] = subject;
    window.adminNotifSettings[evt + '_message'] = message;

    if (btn) btn.disabled = true;
    if (statusMsg) {
      statusMsg.innerText = "⏳ Enregistrement du modèle...";
      statusMsg.style.color = "var(--primary-color)";
    }

    google.script.run
      .withSuccessHandler(function() {
        if (btn) btn.disabled = false;
        if (statusMsg) {
          statusMsg.innerText = "✅ Modèle enregistré avec succès !";
          statusMsg.style.color = "green";
          setTimeout(() => { if (statusMsg) statusMsg.innerText = ""; }, 4000);
        }
      })
      .withFailureHandler(function(err) {
        if (btn) btn.disabled = false;
        if (statusMsg) {
          statusMsg.innerText = "❌ Erreur: " + err.message;
          statusMsg.style.color = "red";
        }
      })
      .saveEvaluationNotificationSettings(window.kanagaToken, window.adminNotifSettings);
  }

  function saveNotificationActivation(val) {

    window.adminNotifSettings.activation = val;

  function resetCurrentNotificationTemplate() {
    const select = document.getElementById('eval-email-event-select');
    const evt = select ? select.value : 'initiation_employee';
    const defaultTpl = DEFAULT_FRONTEND_NOTIF_TEMPLATES[evt];
    if (!defaultTpl) return;

      document.getElementById('eval-email-subject').value = defaultTpl.subject;
      document.getElementById('eval-email-message').value = defaultTpl.message;

    const status = document.getElementById('eval-test-email-status');

    if (status) {

  // --- Navigation (SPA Logic) ---
  function navigateTo(viewId) {
    if (viewId === 'tickets' || viewId === 'it-dashboard' || viewId === 'responses') {
      viewId = 'hub';
    }

    // Hide all views
    document.querySelectorAll('.app-view').forEach(view => {
      view.style.display = 'none';
    });
    // Remove active class from nav buttons
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.classList.remove('active');
    });

    // Show target view
    document.getElementById('view-' + viewId).style.display = 'block';
    
    // Set active button if it exists
    const navBtn = document.getElementById('nav-' + viewId);
    if(navBtn) navBtn.classList.add('active');

    // Load specific data if needed
    if (viewId === 'timesheet') {
      // Data is preloaded
    } else if (viewId === 'evaluation') {
      loadEvaluationData();
    } else if (viewId === 'admin') {
      loadAdminData();
    } else if (viewId === 'tickets') {
      loadUserTickets();
    } else if (viewId === 'it-dashboard') {
      loadAllTickets();
    } else if (viewId === 'responses') {
      loadFormResponsesData();
    }
  }

  // --- Odoo Sync Logic ---
  function loadTimesheetData() {
    google.script.run
      .withSuccessHandler(dataFromServer => {
        projectData = dataFromServer;
        populateProjectDropdowns();
        fetchUserTimesheets();
      })
      .withFailureHandler(err => console.error(err))

  function populateProjectDropdowns() {
    const projects = Object.keys(projectData).sort();
    const mainSelect = document.getElementById('project');
    const editSelect = document.getElementById('edit-project');
    
    if (choicesInstances.project) choicesInstances.project.destroy();
    if (choicesInstances.editProject) choicesInstances.editProject.destroy();
    
    choicesInstances.project = new Choices(mainSelect, { removeItemButton: true, placeholder: true, placeholderValue: 'Sélectionnez un projet' });
    choicesInstances.project.setChoices(projects.map(p => ({ value: p, label: p })), 'value', 'label', true);
    mainSelect.addEventListener('change', () => updateTaskDropdown('project', 'task', 'sub-task'));
    
    choicesInstances.editProject = new Choices(editSelect, { removeItemButton: true, placeholder: true });
    choicesInstances.editProject.setChoices(projects.map(p => ({ value: p, label: p })), 'value', 'label', true);
    editSelect.addEventListener('change', () => updateTaskDropdown('edit-project', 'edit-task', 'edit-sub-task'));
  }

  function updateTaskDropdown(projectElementId, taskElementId, subTaskElementId) {
    const projectSelect = document.getElementById(projectElementId);
    const taskSelect = document.getElementById(taskElementId);
    const selectedProject = projectSelect.value;
    const rawTasks = projectData[selectedProject] || [];
    
    if (subTaskElementId) {
       const subTaskGroup = document.getElementById(subTaskElementId + '-group');
       if (subTaskGroup) subTaskGroup.style.display = 'none';
    }
    
    const checkboxId = (taskElementId === 'task') ? 'hide-completed-tasks' : 'edit-hide-completed-tasks';
    const checkbox = document.getElementById(checkboxId);
    const hideCompleted = checkbox ? checkbox.checked : false;

    const tasks = rawTasks
      .filter(t => {
        const isCompleted = (typeof t === 'object' && t !== null) ? t.isCompleted : false;
        if (hideCompleted && isCompleted) return false;
        const parentId = (typeof t === 'object' && t !== null) ? t.parentId : null;
        return !parentId || parentId === '' || parentId === 'False' || parentId === 'false'; // only root tasks
      })
      .map(t => (typeof t === 'object' && t !== null) ? t.name : t)
      .sort((a, b) => (a || '').localeCompare(b || ''));

    const choicesKey = (taskElementId === 'task') ? 'task' : 'editTask';

    if (!choicesInstances[choicesKey]) {
      choicesInstances[choicesKey] = new Choices(taskSelect, { placeholder: true, placeholderValue: 'Sélectionnez une tâche' });
      taskSelect.addEventListener('change', () => {
         if (subTaskElementId) updateSubTaskDropdown(projectElementId, taskElementId, subTaskElementId);
      });
    }
    
    choicesInstances[choicesKey].setChoices(
      [{ value: '', label: 'Aucune' }].concat(tasks.map(t => ({ value: t, label: t }))),
      'value', 'label', true
    );
    
    if (subTaskElementId) updateSubTaskDropdown(projectElementId, taskElementId, subTaskElementId);
  }

  function updateSubTaskDropdown(projectElementId, taskElementId, subTaskElementId) {
    if (!subTaskElementId) return;
    const projectSelect = document.getElementById(projectElementId);
    const taskSelect = document.getElementById(taskElementId);
    const subTaskSelect = document.getElementById(subTaskElementId);
    const subTaskGroup = document.getElementById(subTaskElementId + '-group');
    
    const choicesKeyTask = (taskElementId === 'task') ? 'task' : 'editTask';
    const selectedProject = projectSelect.value;
    const selectedTaskName = choicesInstances[choicesKeyTask] ? choicesInstances[choicesKeyTask].getValue(true) : taskSelect.value;
    
    const rawTasks = projectData[selectedProject] || [];
    const parentTaskObj = rawTasks.find(t => (typeof t === 'object' && t !== null) && t.name === selectedTaskName);
    const parentTaskId = parentTaskObj ? parentTaskObj.id : null;
    
    const checkboxId = (taskElementId === 'task') ? 'hide-completed-tasks' : 'edit-hide-completed-tasks';
    const checkbox = document.getElementById(checkboxId);
    const hideCompleted = checkbox ? checkbox.checked : false;

    const subTasks = rawTasks
      .filter(t => {
        const isCompleted = (typeof t === 'object' && t !== null) ? t.isCompleted : false;
        if (hideCompleted && isCompleted) return false;
        const tParentId = (typeof t === 'object' && t !== null) ? t.parentId : null;
        return tParentId && parentTaskId && String(tParentId) === String(parentTaskId);
      })
      .map(t => (typeof t === 'object' && t !== null) ? t.name : t)
      .sort((a, b) => (a || '').localeCompare(b || ''));

    const choicesKey = (subTaskElementId === 'sub-task') ? 'subTask' : 'editSubTask';

    if (subTasks.length > 0) {
        subTaskGroup.style.display = 'block';
        if (!choicesInstances[choicesKey]) {
            choicesInstances[choicesKey] = new Choices(subTaskSelect, { placeholder: true, placeholderValue: 'Sélectionnez une sous-tâche' });
        }
        choicesInstances[choicesKey].setChoices(
            [{ value: '', label: 'Aucune' }].concat(subTasks.map(t => ({ value: t, label: t }))),
            'value', 'label', true
        );
    } else {
        subTaskGroup.style.display = 'none';
        if (choicesInstances[choicesKey]) {
            choicesInstances[choicesKey].setChoices([{ value: '', label: 'Aucune' }], 'value', 'label', true);
        }
    }
  }

  function handleTimesheetSubmit(e) {
    e.preventDefault();
    const statusDiv = document.getElementById('status');
    statusDiv.innerText = 'Enregistrement...';
    statusDiv.style.color = 'var(--text-color)';
    
    let finalTask = choicesInstances.task ? (choicesInstances.task.getValue(true) || '') : '';
    if (choicesInstances.subTask && document.getElementById('sub-task-group').style.display !== 'none') {
       const subTaskVal = choicesInstances.subTask.getValue(true);
       if (subTaskVal) finalTask = finalTask + ' > ' + subTaskVal;
    }
    
    const formData = {
      entryDate: document.getElementById('entryDate').value,
      project: choicesInstances.project.getValue(true) || '',
      task: finalTask,
      description: document.getElementById('description').value,
      duration: document.getElementById('duration').value
    };

  function fetchUserTimesheets() {
    document.getElementById('timesheet-loader').style.display = 'block';
    google.script.run

      .withFailureHandler(err => console.error(err))
      .getUserTimesheets(window.kanagaToken);

  function displayTimesheets(data) {
    document.getElementById('timesheet-loader').style.display = 'none';
    const tableBody = document.getElementById('timesheet-table').querySelector('tbody');
    tableBody.innerHTML = ''; 
    
    for (let i = 0; i <= 6; i++) {
        const dayEl = document.getElementById('day-' + i);
        if(dayEl) dayEl.innerHTML = '';
    }

    if (data.error || !Array.isArray(data)) {
        tableBody.innerHTML = `<tr><td colspan="6">Erreur: ${data.error || 'Données invalides.'}</td></tr>`;
        return;
    }
    if (data.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Aucune entrée pour cette semaine.</td></tr>';
        return;
    }

    data.forEach(entry => {
        const entryDate = new Date(entry.date);
        const dateForInput = entryDate.toISOString().split('T')[0];
        
        // Check for sub-task
        const isSubtask = entry.task && entry.task.includes(" > ");
        const taskText = isSubtask ? entry.task.split(" > ").pop().trim() : (entry.task ? entry.task.replace("↳", "").trim() : '');

        // List View
        const newRow = tableBody.insertRow();
        newRow.insertCell().textContent = entryDate.toLocaleDateString('fr-FR');
        newRow.insertCell().textContent = entry.project;
        
        const taskCell = newRow.insertCell();
        taskCell.appendChild(document.createTextNode(entry.task || ''));
        
        newRow.insertCell().textContent = entry.description;
        newRow.insertCell().textContent = entry.duration + 'h';
        
        const actionsCell = newRow.insertCell();
        actionsCell.className = 'actions-cell';
        actionsCell.innerHTML = `
          <button class="edit-btn" onclick='openEditModal(${JSON.stringify(entry).replace(/'/g, "&#39;")}, "${dateForInput}")'>Modifier</button>
          <button class="delete-btn" onclick="handleDelete('${entry.rowId}')">Supprimer</button>
        `;
        
        // Calendar View
        const dayOfWeek = entryDate.getDay();
        const dayCell = document.getElementById('day-' + dayOfWeek);
        if (dayCell) {
          const entryBlock = document.createElement('div');
          entryBlock.className = 'entry-block';
          
          let taskHTML = '';
          if (entry.task) {
              const safeTask = (entry.task || '').replace(/</g, "&lt;").replace(/>/g, "&gt;");
              taskHTML = safeTask + ': ';
          }
          
          const safeDesc = (entry.description || '').replace(/</g, "&lt;").replace(/>/g, "&gt;");
          entryBlock.innerHTML = `<strong>${(entry.project||'').replace(/</g, "&lt;")}</strong> <span class="duration">${entry.duration}h</span><span class="description">${taskHTML}${safeDesc}</span>`;
          dayCell.appendChild(entryBlock);
        }
    });
  }

  function openEditModal(entry, dateForInput) {
      document.getElementById('edit-row-id').value = entry.rowId;
      document.getElementById('edit-entryDate').value = dateForInput;
      document.getElementById('edit-description').value = entry.description;
      document.getElementById('edit-duration').value = entry.duration;
      
      let mainTask = entry.task || '';
      let subTask = '';
      if (mainTask.includes(' > ')) {
         const parts = mainTask.split(' > ');
         mainTask = parts[0].trim();
         subTask = parts[1].trim();
      } else if (mainTask.includes('↳')) { 
         mainTask = mainTask.replace('↳', '').trim();
      }
      
      choicesInstances.editProject.setChoiceByValue(entry.project || '');
      updateTaskDropdown('edit-project', 'edit-task', 'edit-sub-task');
      
      setTimeout(() => {
          if (choicesInstances.editTask) {
              choicesInstances.editTask.setChoiceByValue(mainTask);
              updateSubTaskDropdown('edit-project', 'edit-task', 'edit-sub-task');
          }
          setTimeout(() => {
             if (subTask && choicesInstances.editSubTask && document.getElementById('edit-sub-task-group').style.display !== 'none') {
                choicesInstances.editSubTask.setChoiceByValue(subTask);
             }
          }, 150);
      }, 100);

      document.getElementById('edit-modal').style.display = 'block';
  }

  function handleEditSubmit(e) {
    e.preventDefault();
    
    let finalTask = choicesInstances.editTask ? (choicesInstances.editTask.getValue(true) || '') : '';
    if (choicesInstances.editSubTask && document.getElementById('edit-sub-task-group').style.display !== 'none') {
       const subTaskVal = choicesInstances.editSubTask.getValue(true);
       if (subTaskVal) finalTask = finalTask + ' > ' + subTaskVal;
    }
    
    const updatedData = {
      rowId: document.getElementById('edit-row-id').value,
      entryDate: document.getElementById('edit-entryDate').value,
      project: choicesInstances.editProject.getValue(true),
      task: finalTask,
      description: document.getElementById('edit-description').value,
      duration: document.getElementById('edit-duration').value,
    };
    
    google.script.run
      .withSuccessHandler(() => {
        closeModal('edit-modal');
        fetchUserTimesheets();
      })
      .withFailureHandler(err => alert("Erreur: " + err.message))
      .updateTimesheetEntry(window.kanagaToken, updatedData);

  function handleDelete(rowId) {
    if (confirm("Êtes-vous sûr de vouloir supprimer cette entrée ?")) {
      google.script.run
        .withSuccessHandler(fetchUserTimesheets)
        .withFailureHandler(err => alert("Erreur: " + err.message))
        .deleteTimesheetEntry(window.kanagaToken, rowId);

  function setDateValidation() {
    const today = new Date();
    const oneMonthAgo = new Date(new Date().setMonth(today.getMonth() - 1));
    const todayStr = today.toISOString().split('T')[0];
    const oneMonthAgoStr = oneMonthAgo.toISOString().split('T')[0];
    ['entryDate', 'edit-entryDate'].forEach(id => {
      const el = document.getElementById(id);
      if(el) {
        el.max = todayStr;
        el.min = oneMonthAgoStr;
      }
    });
    if(document.getElementById('entryDate')) {
      document.getElementById('entryDate').value = todayStr;
    }
  }

  // --- Evaluation Logic ---
  let evalQuestions = {};
  const scaleOptions = ["PI", "PA", "CA", "PS", "PE", "N/A"];

  function findProfileQuestions(profileName) {
    if (!evalQuestions || !profileName) return null;
    const target = profileName.toLowerCase().trim();
    for (const key in evalQuestions) {
      if (key.toLowerCase().trim() === target) {
        return evalQuestions[key];
      }
    }
    return null;
  }

        html += `</div>`;

        pendingContainer.style.display = 'none';
        pendingContainer.innerHTML = '';

    }

       google.script.run
         .withSuccessHandler(function(evalsStr) {

        document.getElementById('eval-wizard-progress').style.display = 'flex';
        document.getElementById('btn-next-step1').style.display = 'inline-block';

        if (ev) {
            // 1. Période pré-remplie et NON modifiable
            periodInput.value = ev.period || '';
            periodInput.readOnly = true;
            periodInput.style.backgroundColor = '#f8f9fa';
            periodInput.style.cursor = 'not-allowed';

            // 2. Collaborateur pré-rempli et NON modifiable (l'auto-évaluateur ne choisit pas)
            const empEmail = ev.employeeEmail || (currentUser ? currentUser.username : '');
            const empName = ev.employeeName || (currentUser ? currentUser.fullName : empEmail);
            empSelect.innerHTML = `<option value="${empEmail}" selected>${empName}</option>`;
            empSelect.style.display = 'none';

            if (empDisplay) {
                empDisplay.style.display = 'block';
                empDisplay.innerHTML = `
                  <div style="padding: 10px 14px; background: #f8f9fa; border: 1px solid #ced4da; border-radius: 4px; font-size: 14px; color: #212529; font-weight: 600;">
                    ${escapeHtml(empName)} <span style="font-weight: normal; color: #6c757d;">(${escapeHtml(empEmail)})</span>
                  </div>
                `;
            }

            // 3. Profil de poste pré-rempli et NON modifiable
            let profFound = false;
            for (let i = 0; i < profileSelect.options.length; i++) {
                if (profileSelect.options[i].value.toLowerCase().trim() === (ev.profile || '').toLowerCase().trim()) {
                    profileSelect.selectedIndex = i;
                    profFound = true;
                    break;
                }
            }
            if (!profFound && ev.profile) {
                const opt = new Option("Profil : " + ev.profile, ev.profile, true, true);
                profileSelect.appendChild(opt);
            }
            profileSelect.disabled = true;
            profileSelect.style.backgroundColor = '#f8f9fa';

        // Pré-remplissage pour l'auto-évaluation (si brouillon existant)
        if (type === 'Auto-évaluation' && ev) {

            document.getElementById('eval-improvements').value = ev.improvements || '';

            document.getElementById('eval-aspirations').value = ev.aspirations || '';

            try {
                if (ev.fondamentales) {
                    const parsed = JSON.parse(ev.fondamentales);
                    parsed.forEach((item, idx) => {
                        const r = document.querySelector(`input[name="fonda_q${idx}"][value="${item.answer}"]`);

                        const c = document.querySelector(`textarea[name="fonda_emp_comment_${idx}"]`);
                        if(c) c.value = item.empComment || item.comment || '';
                    });
                }
                if (ev.specifiques) {
                    const parsed = JSON.parse(ev.specifiques);
                    parsed.forEach((item, idx) => {
                        const r = document.querySelector(`input[name="spec_q${idx}"][value="${item.answer}"]`);
                        if(r) r.checked = true;
                        const c = document.querySelector(`textarea[name="spec_emp_comment_${idx}"]`);
                        if(c) c.value = item.empComment || item.comment || '';
                    });
                }
                conclusionQuestions.forEach((q, idx) => {
                    let ans = '';
                    const qText = (q.text || '').toLowerCase();
                    if (qText.includes('objectifs') && (qText.includes('écoulée') || qText.includes('passés'))) ans = ev.pastGoals || '';
                    else if (qText.includes('points forts')) ans = ev.strengths || '';
                    else if (qText.includes('amélioration')) ans = ev.improvements || '';
                    else if (qText.includes('performance globale') || qText.includes('note globale')) ans = ev.globalRating || '';
                    else if (qText.includes('formation')) ans = ev.training || '';
                    else if (qText.includes('smart')) ans = ev.smartGoals || '';
                    else if (qText.includes('aspirations')) ans = ev.aspirations || '';
                    else if (qText.includes('commentaires')) ans = ev.empComments || '';
                    else {
                        if (idx === 0) ans = ev.pastGoals || '';
                        if (idx === 1) ans = ev.strengths || '';
                        if (idx === 2) ans = ev.improvements || '';
                        if (idx === 3) ans = ev.globalRating || '';
                        if (idx === 4) ans = ev.training || '';
                        if (idx === 5) ans = ev.smartGoals || '';
                        if (idx === 6) ans = ev.aspirations || '';
                        if (idx === 7) ans = ev.empComments || '';
                    }
                    if (q.type === 'scale' || q.type === 'boolean') {
                        const r = document.querySelector(`input[name="conclusion_q${idx}"][value="${ans}"]`);
                        if(r) r.checked = true;
                    } else if (q.type === 'text') {
                        const t = document.querySelector(`textarea[name="conclusion_q${idx}"]`);
                        if(t) t.value = ans;
                    }
                });
            } catch(e) {}
        }

        // Pré-remplissage pour l'évaluation secondaire (si déjà saisi)
        if (type === 'Évaluation Secondaire' && ev) {
            document.getElementById('eval-past-goals').value = ev.pastGoals || '';
            document.getElementById('eval-aspirations').value = ev.aspirations || '';
            
            let mySynth = null;
            try {
              const synthList = JSON.parse(ev.secondarySynthese || '[]');
              mySynth = synthList.find(s => s.evaluatorEmail === currentUser.username || s.evaluatorName === currentUser.fullName);
            } catch(e){}

            if (mySynth) {
              document.getElementById('eval-strengths').value = mySynth.strengths || '';
              document.getElementById('eval-improvements').value = mySynth.improvements || '';
              document.getElementById('eval-global-rating').value = mySynth.globalRating || '';
              document.getElementById('eval-training').value = mySynth.training || '';
              document.getElementById('eval-smart-goals').value = mySynth.smartGoals || '';

  function submitInitiation() {
      const profile = document.getElementById('eval-profile-select').value;
      const period = document.getElementById('eval-period').value;
      
      let selectedEmployees = [];
      if (window.empChoices) {
         selectedEmployees = window.empChoices.getValue(true);
      }
      
      const princEmail = document.getElementById('eval-principal-evaluator').value;
      if (!princEmail) {
          alert("Veuillez sélectionner un évaluateur principal.");
          return;
      }

      if (!profile || !period || !selectedEmployees || selectedEmployees.length === 0) {
          alert('Veuillez remplir tous les champs obligatoires et sélectionner au moins un employé.');
          return;
      }
      
      // Construire le tableau avec les noms
      const employeeDataList = selectedEmployees.map(email => {
         const empObj = window.employeeList.find(e => e.email === email);
         return {
            email: email,
            name: empObj ? empObj.fullName : email
         };
      });

      const princObj = window.employeeList.find(e => e.email === princEmail);
      const principalEvaluator = {
         email: princEmail,
         name: princObj ? princObj.fullName : princEmail
      };

      let selectedSecondaries = [];
      if (window.secChoices) {
         selectedSecondaries = window.secChoices.getValue(true) || [];
      }
      const secondaryEvaluators = selectedSecondaries.map(email => {
         const empObj = window.employeeList.find(e => e.email === email);
         return {
            email: email,
            name: empObj ? empObj.fullName : email
         };
      });
      
      const formData = {
        period: period,
        employees: employeeDataList,
        profile: profile,
        evaluatorName: principalEvaluator.name,
        principalEvaluator: principalEvaluator,
        secondaryEvaluators: secondaryEvaluators
      };
      
      const btn = document.getElementById('btn-submit-initiation');
      btn.disabled = true;
      btn.innerText = 'Initiation...';
      
      google.script.run
        .withSuccessHandler(() => {
           alert('Évaluation(s) initiée(s) avec succès.');
           showManagerDashboard();
           btn.disabled = false;
           btn.innerText = "Initier l'évaluation";
        })
        .withFailureHandler(err => {
           alert('Erreur: ' + err.message);
           btn.disabled = false;
           btn.innerText = "Initier l'évaluation";
        })
        .initiateEvaluationsBatch(window.kanagaToken, formData);

  function nextEvalStep(current, next) {
    if (current === 1) {
        if (!document.getElementById('eval-period').value) {
            alert('Veuillez renseigner la période d\'évaluation.');
            return;
        }
        if (window.evalCurrentMode === 'Initiation') {
            if (!document.getElementById('eval-employee-email').value) {
                alert('Veuillez sélectionner au moins un collaborateur.');
                return;
            }
            if (!document.getElementById('eval-principal-evaluator').value) {
                alert('Veuillez désigner un évaluateur principal.');
                return;
            }
        }
    }
    if (current === 2) {
        const fondaQuestions = (evalQuestions && evalQuestions.fondamentales) ? evalQuestions.fondamentales : [];
        if (!validateSectionQuestions('fonda', fondaQuestions)) {
            alert('Veuillez répondre à toutes les questions obligatoires du tronc commun avant de passer à la suite.');
            return;
        }

        const profile = (window.evalCurrentEv && window.evalCurrentEv.profile) ? window.evalCurrentEv.profile : document.getElementById('eval-profile-select').value;
        if (!profile) {
            alert('Veuillez sélectionner un profil.');
            return;
        }
        const specQuestions = (profile !== 'Autre') ? findProfileQuestions(profile) : null;
        if (!specQuestions || specQuestions.length === 0 || profile === 'Autre') {
            next = 4; // Aiguillage: pas de questions spécifiques, saut direct vers la Section 3
        } else if(window.evalCurrentMode !== 'Initiation') {
            generateGrid('grid-specifiques', 'spec', specQuestions);
            document.getElementById('step-3-title').innerText = "Section 2 : Aiguillage - " + profile;
            document.getElementById('step-nav-3').style.display = 'inline-block';
            window.evalCurrentSpecPage = 1;
            updateSpecPageView();
        }
    }
    if (current === 3 && next === 4) {
        const profile = (window.evalCurrentEv && window.evalCurrentEv.profile) ? window.evalCurrentEv.profile : document.getElementById('eval-profile-select').value;
        const specQuestions = (profile !== 'Autre') ? findProfileQuestions(profile) : null;
        if (specQuestions && specQuestions.length > 0) {
            if (!validateSectionQuestions('spec', specQuestions, window.evalCurrentSpecPage)) {
                alert('Veuillez répondre à toutes les questions obligatoires de cette page avant de continuer.');
                return;
            }
        }
    }
    if (next === 4) {
        window.evalCurrentConclusionPage = 1;
        updateConclusionPageView();
    }
    showEvalStep(next);
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  window.toggleEvalScaleModal = function(show) {
    const modal = document.getElementById('eval-scale-modal');
    if (modal) modal.style.display = show ? 'flex' : 'none';
  };

  function getEvalBadgeClass(rating) {
    if (!rating) return 'na';
    const r = rating.toString().toUpperCase().trim();
    if (r.startsWith('PE') || r === '5') return 'pe';
    if (r.startsWith('PS') || r === '4') return 'ps';
    if (r.startsWith('CA') || r === '3') return 'ca';
    if (r.startsWith('PA') || r === '2') return 'pa';
    if (r.startsWith('PI') || r === '1') return 'pi';
    return 'na';
  }

  window.clearQuestionError = function(prefix, idx) {
    const row = document.getElementById('row-' + prefix + '-' + idx);
    if (row) {
      row.style.border = '';
      row.style.borderRadius = '';
      row.style.backgroundColor = '';
      row.style.padding = '';
      row.style.boxShadow = '';
    }
    const errEl = document.getElementById('error-msg-' + prefix + '-' + idx);
    if (errEl) errEl.style.display = 'none';
  };

  window.setQuestionError = function(prefix, idx) {
    const row = document.getElementById('row-' + prefix + '-' + idx);
    if (row) {
      row.style.border = '2px solid #e53935';
      row.style.borderRadius = '8px';
      row.style.backgroundColor = '#fff8f8';
      row.style.padding = '14px';
      row.style.boxShadow = '0 2px 8px rgba(229, 57, 53, 0.15)';
      row.style.transition = 'all 0.3s ease';
    }
    const errEl = document.getElementById('error-msg-' + prefix + '-' + idx);
    if (errEl) errEl.style.display = 'block';
  };

  window.isQuestionAnswered = function(prefix, idx, qType) {
    if (qType === 'section') return true;
    if (qType === 'text') {
      const el = document.querySelector('textarea[name="' + prefix + '_q' + idx + '"]');
      return el && el.value.trim().length > 0;
    } else {
      const selected = document.querySelector('input[name="' + prefix + '_q' + idx + '"]:checked');
      return selected !== null;
    }
  };

  window.validateSectionQuestions = function(prefix, questionsList, pageFilter) {
    if (!questionsList || !Array.isArray(questionsList) || questionsList.length === 0) return true;
    let firstInvalidRow = null;
    let allValid = true;

    questionsList.forEach((qObj, idx) => {
      const q = typeof qObj === 'string' ? { text: qObj, type: 'scale', page: 1 } : qObj;
      if (q.type === 'section') return;
      
      const qPage = parseInt(q.page, 10) || 1;
      if (pageFilter !== undefined && pageFilter !== null && qPage !== pageFilter) {
        return;
      }

      const answered = isQuestionAnswered(prefix, idx, q.type);
      if (!answered) {
        setQuestionError(prefix, idx);
        allValid = false;
        if (!firstInvalidRow) {
          firstInvalidRow = document.getElementById('row-' + prefix + '-' + idx);
        }
      } else {
        clearQuestionError(prefix, idx);
      }
    });

    if (!allValid && firstInvalidRow) {
      firstInvalidRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    return allValid;
  };

  function generateGrid(containerId, prefix, questions) {
    const container = document.getElementById(containerId);
    let html = '';
    if(!questions) return;
    questions.forEach((qObj, idx) => {
      // Pour la compatibilité arrière si d'anciens formats sont passés
      const q = typeof qObj === 'string' ? { text: qObj, type: 'scale', options: 'PI, PA, CA, PS, PE, N/A', description: "" } : qObj;
      const text = q.text.replace(/`/g, "'");
      const desc = q.description ? `<div style="font-size:12px; color:#666; margin-top:4px;">${q.description.replace(/`/g, "'")}</div>` : '';
      
      // Données existantes du collaborateur si consultation / évaluation manager
      let collabAnswer = '';
      let collabComment = '';
      if (window.evalCurrentEv) {
        try {
          let listStr = null;
          if (prefix === 'fonda') listStr = window.evalCurrentEv.fondamentales;
          else if (prefix === 'spec') listStr = window.evalCurrentEv.specifiques;
          else if (prefix === 'conclusion') listStr = window.evalCurrentEv.conclusion;

          if (listStr) {
            const parsed = JSON.parse(listStr);
            if (parsed && parsed[idx]) {
              collabAnswer = parsed[idx].answer || '';
              collabComment = parsed[idx].empComment || parsed[idx].comment || '';

            const qText = (q.text || '').toLowerCase();
            if (qText.includes('objectifs') && (qText.includes('écoulée') || qText.includes('passés'))) collabAnswer = window.evalCurrentEv.pastGoals || '';
            else if (qText.includes('points forts')) collabAnswer = window.evalCurrentEv.strengths || '';
            else if (qText.includes('amélioration')) collabAnswer = window.evalCurrentEv.improvements || '';
            else if (qText.includes('performance globale') || qText.includes('note globale')) collabAnswer = window.evalCurrentEv.globalRating || '';
            else if (qText.includes('formation')) collabAnswer = window.evalCurrentEv.training || '';
            else if (qText.includes('smart')) collabAnswer = window.evalCurrentEv.smartGoals || '';
            else if (qText.includes('aspirations')) collabAnswer = window.evalCurrentEv.aspirations || '';
            else if (qText.includes('commentaires')) collabAnswer = window.evalCurrentEv.empComments || '';
            else {
              if (idx === 0) collabAnswer = window.evalCurrentEv.pastGoals || '';
              if (idx === 1) collabAnswer = window.evalCurrentEv.strengths || '';
              if (idx === 2) collabAnswer = window.evalCurrentEv.improvements || '';
              if (idx === 3) collabAnswer = window.evalCurrentEv.globalRating || '';
              if (idx === 4) collabAnswer = window.evalCurrentEv.training || '';
              if (idx === 5) collabAnswer = window.evalCurrentEv.smartGoals || '';
              if (idx === 6) collabAnswer = window.evalCurrentEv.aspirations || '';
              if (idx === 7) collabAnswer = window.evalCurrentEv.empComments || '';
            }
          }
        } catch(e) {}
      }

      let collabSummaryHtml = '';
      if (window.evalCurrentMode === 'Évaluation Manager' || window.evalCurrentMode === 'Évaluation Secondaire') {
        const badgeCls = getEvalBadgeClass(collabAnswer);
        const commentDisplay = collabComment ? escapeHtml(collabComment) : '<em>Aucun commentaire renseigné par le collaborateur</em>';
        collabSummaryHtml = `
          <div class="eval-collab-summary">
            <div class="eval-collab-summary-header">
              <span>Auto-évaluation du Collaborateur</span>
              <span class="eval-badge eval-badge-${badgeCls}">${collabAnswer || 'Non renseignée'}</span>
            </div>
            <div class="eval-collab-comment-content">
              <strong>Commentaire collaborateur :</strong> ${commentDisplay}
            </div>
          </div>
        `;
      }

      let secondarySummaryHtml = '';
      if (window.evalCurrentMode === 'Évaluation Manager' && window.evalCurrentEv) {
        try {
          if (prefix === 'conclusion') {
            let secSynth = [];
            try { secSynth = JSON.parse(window.evalCurrentEv.secondarySynthese || '[]'); } catch(e){}
            if (Array.isArray(secSynth) && secSynth.length > 0) {
              secSynth.forEach(s => {
                let sVal = '';
                const qText = (q.text || '').toLowerCase();
                if (qText.includes('points forts')) sVal = s.strengths || '';
                else if (qText.includes('amélioration')) sVal = s.improvements || '';
                else if (qText.includes('performance globale') || qText.includes('note globale')) sVal = s.globalRating || '';
                else if (qText.includes('formation')) sVal = s.training || '';
                else if (qText.includes('smart')) sVal = s.smartGoals || '';
                else if (qText.includes('commentaires')) sVal = s.comments || '';
                else {
                  if (idx === 1) sVal = s.strengths || '';
                  if (idx === 2) sVal = s.improvements || '';
                  if (idx === 3) sVal = s.globalRating || '';
                  if (idx === 4) sVal = s.training || '';
                  if (idx === 5) sVal = s.smartGoals || '';
                  if (idx === 7) sVal = s.comments || '';
                }
                if (sVal) {
                  const bCls = getEvalBadgeClass(sVal);
                  secondarySummaryHtml += `
                    <div class="eval-collab-summary" style="border-left: 3px solid #ff9800; background: #fffcf5; margin-top: 6px;">
                      <div class="eval-collab-summary-header">
                        <span style="color:#b25900;">Évaluateur Secondaire (${escapeHtml(s.evaluatorName || s.evaluatorEmail)})</span>
                        ${q.type === 'scale' ? `<span class="eval-badge eval-badge-${bCls}">${escapeHtml(sVal)}</span>` : ''}
                      </div>
                      ${q.type !== 'scale' ? `<div class="eval-collab-comment-content">${escapeHtml(sVal).replace(/\n/g, '<br>')}</div>` : ''}
                    </div>
                  `;
                }
              });
            }
          } else {
            const secListStr = prefix === 'fonda' ? window.evalCurrentEv.secondaryFondamentales : window.evalCurrentEv.secondarySpecifiques;
            if (secListStr) {
              const secList = JSON.parse(secListStr);
              if (Array.isArray(secList) && secList.length > 0) {
                secList.forEach(entry => {
                  const resp = entry.responses && entry.responses[idx];
                  if (resp && resp.answer) {
                    const bCls = getEvalBadgeClass(resp.answer);
                    const comm = resp.comment || resp.secComment || resp.mgrComment || '';
                    secondarySummaryHtml += `
                      <div class="eval-collab-summary" style="border-left: 3px solid #ff9800; background: #fffcf5; margin-top: 6px;">
                        <div class="eval-collab-summary-header">
                          <span style="color:#b25900;">Évaluateur Secondaire (${escapeHtml(entry.evaluatorName || entry.evaluatorEmail)})</span>
                          <span class="eval-badge eval-badge-${bCls}">${escapeHtml(resp.answer)}</span>
                        </div>

                  }
                });
              }
            }

        } catch(e) {}
      }

      if (q.type === 'section') {
          html += `<div class="eval-section-header" data-page="${q.page || 1}" style="margin-top: 30px; margin-bottom: 15px; padding: 15px 20px; background: #FAF8F5; border-left: 4px solid var(--secondary-color); border-radius: 4px;">
                     <h3 style="margin: 0; color: var(--primary-color); font-size: 18px;">${text}</h3>
                     ${q.description ? `<p style="margin: 5px 0 0 0; color: #666; font-size: 13px;">${q.description.replace(/`/g, "'")}</p>` : ''}
                   </div>`;
          return; // Skip the rest of the rendering for this item
      }

      html += `<div class="eval-grid-row" id="row-${prefix}-${idx}" data-page="${q.page || 1}">
                 <div class="eval-grid-question">
                    ${text}
                    ${desc}
                 </div>
                 ${collabSummaryHtml}
                 ${secondarySummaryHtml}
                 <div class="eval-grid-options">`;
                 
      if (q.type === 'scale') {
          const opts = (q.options || 'PI, PA, CA, PS, PE, N/A').split(',').map(s => s.trim());
          opts.forEach(opt => {
              html += `<label class="eval-radio-label">
                         <input type="radio" name="${prefix}_q${idx}" value="${opt}" onchange="clearQuestionError('${prefix}', ${idx})">
                         ${opt}
                       </label>`;
          });
      } else if (q.type === 'boolean') {
          html += `<label class="eval-radio-label"><input type="radio" name="${prefix}_q${idx}" value="Oui" onchange="clearQuestionError('${prefix}', ${idx})"> Oui</label>`;
          html += `<label class="eval-radio-label"><input type="radio" name="${prefix}_q${idx}" value="Non" onchange="clearQuestionError('${prefix}', ${idx})"> Non</label>`;
      } else if (q.type === 'text') {
          html += `<textarea name="${prefix}_q${idx}" class="form-control" rows="3" placeholder="Votre réponse..." oninput="clearQuestionError('${prefix}', ${idx})"></textarea>`;
      }
      
      html += `</div>`;

      // Message d'erreur visible si la question n'est pas remplie
      html += `<div id="error-msg-${prefix}-${idx}" class="eval-q-error-text" style="display:none; color:#c62828; font-size:12px; font-weight:600; margin-top:8px; padding:6px 10px; background:#ffebee; border-radius:4px; border-left:3px solid #c62828;">
        ⚠️ Veuillez répondre à cette question pour continuer.
      </div>`;

      // Commentaires collaborateur et évaluateur
      if (q.type === 'scale' || q.type === 'boolean') {
          html += `<div class="eval-question-comments">`;
          if (window.evalCurrentMode === 'Évaluation Manager') {
              html += `
                <div class="eval-comment-group">
                  <label class="eval-comment-label">Commentaire de l'évaluateur principal :</label>
                  <textarea name="${prefix}_mgr_comment_${idx}" class="eval-comment-box" rows="2" placeholder="Saisissez votre appréciation, remarques ou justifications..."></textarea>
                </div>
              `;
          } else if (window.evalCurrentMode === 'Évaluation Secondaire') {
              html += `
                <div class="eval-comment-group">
                  <label class="eval-comment-label">Commentaire de l'évaluateur secondaire :</label>
                  <textarea name="${prefix}_sec_comment_${idx}" class="eval-comment-box" rows="2" placeholder="Saisissez votre appréciation, remarques ou justifications..."></textarea>
                </div>
              `;
          } else {
              html += `
                <div class="eval-comment-group">
                  <label class="eval-comment-label">Commentaire du collaborateur :</label>
                  <textarea name="${prefix}_emp_comment_${idx}" class="eval-comment-box" rows="2" placeholder="Vos explications, exemples de réalisations ou faits marquants..."></textarea>
                </div>
              `;
          }
          html += `</div>`;
      }

      html += `</div>`;
    });
    container.innerHTML = html;
  }

  function getEvaluationFormData() {
    const formData = {
      fondamentales: [],
      specifiques: [],
      conclusion: [],
      pastGoals: document.getElementById('eval-past-goals').value,
      strengths: document.getElementById('eval-strengths').value,
      improvements: document.getElementById('eval-improvements').value,
      globalRating: document.getElementById('eval-global-rating').value,
      training: document.getElementById('eval-training').value,
      smartGoals: document.getElementById('eval-smart-goals').value,
      aspirations: document.getElementById('eval-aspirations').value,
      empComments: document.getElementById('eval-emp-comments').value
    };

    const profile = document.getElementById('eval-profile-select').value;

    const extractItems = (questionsList, prefix) => {
      const result = [];
      if (!questionsList) return result;
      questionsList.forEach((qObj, idx) => {
        const q = typeof qObj === 'string' ? { text: qObj, type: 'scale' } : qObj;
        let ans = '';
        if (q.type === 'text') {
          ans = document.querySelector(`textarea[name="${prefix}_q${idx}"]`)?.value || '';
        } else if (q.type === 'section') {
          ans = '';
        } else {
          const selected = document.querySelector(`input[name="${prefix}_q${idx}"]:checked`);
          ans = selected ? selected.value : '';
        }

        const empCommentEl = document.querySelector(`textarea[name="${prefix}_emp_comment_${idx}"]`);
        const secCommentEl = document.querySelector(`textarea[name="${prefix}_sec_comment_${idx}"]`);
        const mgrCommentEl = document.querySelector(`textarea[name="${prefix}_mgr_comment_${idx}"]`);

        let empComment = empCommentEl ? empCommentEl.value : '';
        let secComment = secCommentEl ? secCommentEl.value : '';
        let mgrComment = mgrCommentEl ? mgrCommentEl.value : '';

        // Si non présent dans le formulaire actuel, récupérer les données du collaborateur
        if (window.evalCurrentEv) {
          try {
            let listStr = null;
            let mgrListStr = null;
            if (prefix === 'fonda') {
              listStr = window.evalCurrentEv.fondamentales;
              mgrListStr = window.evalCurrentEv.mgrFondamentales;
            } else if (prefix === 'spec') {
              listStr = window.evalCurrentEv.specifiques;
              mgrListStr = window.evalCurrentEv.mgrSpecifiques;
            } else if (prefix === 'conclusion') {
              listStr = window.evalCurrentEv.conclusion;
              mgrListStr = window.evalCurrentEv.mgrConclusion;
            }

            if (listStr) {
              const p = JSON.parse(listStr);
              if (p && p[idx] && !empComment) {
                empComment = p[idx].empComment || p[idx].comment || '';
              }
            }
            if (mgrListStr) {
              const mp = JSON.parse(mgrListStr);
              if (mp && mp[idx] && !mgrComment) {
                mgrComment = mp[idx].mgrComment || mp[idx].comment || '';
              }
            }
          } catch(e) {}
        }

        result.push({
          question: q.text,
          answer: ans,
          comment: secComment || empComment,
          empComment: empComment,
          secComment: secComment,
          mgrComment: mgrComment
        });
      });
      return result;
    };

    if (evalQuestions && evalQuestions.fondamentales) {
      formData.fondamentales = extractItems(evalQuestions.fondamentales, 'fonda');
    }

    const specQuestions = (profile && profile !== 'Autre') ? findProfileQuestions(profile) : null;
    if (specQuestions && specQuestions.length > 0) {
      formData.specifiques = extractItems(specQuestions, 'spec');
    }

    if (evalQuestions && evalQuestions.conclusion) {
      formData.conclusion = extractItems(evalQuestions.conclusion, 'conclusion');
      formData.conclusion.forEach((item, idx) => {
        const qText = (item.question || '').toLowerCase();
        const val = item.answer || '';
        if (qText.includes('objectifs') && (qText.includes('écoulée') || qText.includes('passés'))) formData.pastGoals = val;
        else if (qText.includes('points forts')) formData.strengths = val;
        else if (qText.includes('amélioration')) formData.improvements = val;
        else if (qText.includes('performance globale') || qText.includes('note globale')) formData.globalRating = val;
        else if (qText.includes('formation')) formData.training = val;
        else if (qText.includes('smart')) formData.smartGoals = val;
        else if (qText.includes('aspirations')) formData.aspirations = val;
        else if (qText.includes('commentaires')) formData.empComments = val || item.comment || '';
        else {
          if (idx === 0 && !formData.pastGoals) formData.pastGoals = val;
          if (idx === 1 && !formData.strengths) formData.strengths = val;
          if (idx === 2 && !formData.improvements) formData.improvements = val;
          if (idx === 3 && !formData.globalRating) formData.globalRating = val;
          if (idx === 4 && !formData.training) formData.training = val;
          if (idx === 5 && !formData.smartGoals) formData.smartGoals = val;
          if (idx === 6 && !formData.aspirations) formData.aspirations = val;
          if (idx === 7 && !formData.empComments) formData.empComments = val || item.comment || '';
        }
      });
    }

    return formData;
  }

  let autosaveTimeout = null;
  function scheduleAutosave() {
      if (!window.evalAttachedRowId) return;
      if (autosaveTimeout) clearTimeout(autosaveTimeout);
      const status = document.getElementById('eval-submit-status');
      status.innerText = 'Sauvegarde en cours...';
      status.style.color = '#888';
      autosaveTimeout = setTimeout(autosaveEvaluation, 2000);
  }

  function autosaveEvaluation() {
      if (!window.evalAttachedRowId) return;
      
      const formData = getEvaluationFormData();
      const status = document.getElementById('eval-submit-status');
      
      if (window.evalCurrentMode === 'Évaluation Manager') {
          const mgrData = {
            mgrFondamentales: formData.fondamentales,
            mgrSpecifiques: formData.specifiques,
            mgrStrengths: formData.strengths,
            mgrImprovements: formData.improvements,
            mgrGlobalRating: formData.globalRating,
            mgrTraining: formData.training,
            mgrSmartGoals: formData.smartGoals,
            mgrComments: formData.empComments
          };
          google.script.run
            .withSuccessHandler(() => {
                status.innerText = 'Brouillon sauvegardé.';
                status.style.color = 'gray';
            })
            .saveAttachedManagerEvaluationDraft(window.kanagaToken, window.evalAttachedRowId, mgrData, currentUser.fullName);
      } else if (window.evalCurrentMode === 'Évaluation Secondaire') {
          // Brouillon secondaire optionnel
      } else {
          google.script.run
            .withSuccessHandler(() => {
                status.innerText = 'Brouillon sauvegardé.';
                status.style.color = 'gray';
            })
            .saveSelfEvaluationDraft(window.kanagaToken, window.evalAttachedRowId, formData);
      }
  }

  document.getElementById('eval-wizard-form').addEventListener('input', scheduleAutosave);
  document.getElementById('eval-wizard-form').addEventListener('change', scheduleAutosave);

  window.submitEvaluationForm = function(e) {
    if (e && e.preventDefault) e.preventDefault();
    if (autosaveTimeout) clearTimeout(autosaveTimeout);

    // 1. Validation de l'étape 1 (Informations générales)
    if (!document.getElementById('eval-period').value) {
      showEvalStep(1);
      alert('Veuillez renseigner la période d\'évaluation.');
      return;
    }

    // 2. Validation de la Section 1 (Tronc commun)
    const fondaQuestions = (evalQuestions && evalQuestions.fondamentales) ? evalQuestions.fondamentales : [];
    if (!validateSectionQuestions('fonda', fondaQuestions)) {
      showEvalStep(2);
      alert('Veuillez répondre à toutes les questions obligatoires du tronc commun avant de soumettre.');
      return;
    }

    // 3. Validation de la Section 2 (Questions spécifiques au profil si applicable)
    const profile = (window.evalCurrentEv && window.evalCurrentEv.profile) ? window.evalCurrentEv.profile : document.getElementById('eval-profile-select').value;
    const specQuestions = (profile !== 'Autre') ? findProfileQuestions(profile) : null;
    if (specQuestions && specQuestions.length > 0) {
      const pageNumbers = getSpecPageNumbers(specQuestions);
      for (let p of pageNumbers) {
        if (!validateSectionQuestions('spec', specQuestions, p)) {
          showEvalStep(3);
          window.evalCurrentSpecPage = p;
          updateSpecPageView();
          alert('Veuillez répondre à toutes les questions obligatoires du profil (Page ' + p + ') avant de soumettre.');
          return;
        }
      }
    }

    // 4. Validation de la Section 3 (Conclusion commune)
    const conclusionQuestions = (evalQuestions && evalQuestions.conclusion) ? evalQuestions.conclusion : [];
    if (conclusionQuestions && conclusionQuestions.length > 0) {
      const pageNumbers = getConclusionPageNumbers(conclusionQuestions);
      for (let p of pageNumbers) {
        if (!validateSectionQuestions('conclusion', conclusionQuestions, p)) {
          showEvalStep(4);
          window.evalCurrentConclusionPage = p;
          updateConclusionPageView();
          alert('Veuillez répondre à toutes les questions obligatoires de la conclusion (Page ' + p + ') avant de soumettre.');
          return;
        }
      }
    }

    // 5. Statut et boutons en cours d'enregistrement
    const btn = document.getElementById('btn-submit-eval');
    const status = document.getElementById('eval-submit-status');
    if (btn) {
      btn.disabled = true;
      btn.innerText = 'Enregistrement en cours...';
    }
    if (status) {
      status.style.display = 'block';
      status.style.background = '#FAF6EE';
      status.style.color = 'var(--primary-color, #7C4C26)';
      status.style.border = '1px solid #E0CC99';
      status.style.borderRadius = '6px';
      status.innerHTML = '⏳ <strong>Enregistrement en cours...</strong> Veuillez patienter pendant la transmission de votre évaluation.';
    }
    
    const formData = getEvaluationFormData();

    if (window.evalCurrentMode === 'Évaluation Manager') {
      const mgrData = {
        mgrFondamentales: formData.fondamentales,
        mgrSpecifiques: formData.specifiques,
        mgrStrengths: formData.strengths,
        mgrImprovements: formData.improvements,
        mgrGlobalRating: formData.globalRating,
        mgrTraining: formData.training,
        mgrSmartGoals: formData.smartGoals,
        mgrComments: formData.empComments
      };
      
      google.script.run
        .withSuccessHandler(() => {
           if (status) {
             status.style.background = '#e8f5e9';
             status.style.color = '#2e7d32';
             status.style.border = '1px solid #c8e6c9';
             status.innerHTML = '✅ <strong>Évaluation manager enregistrée avec succès !</strong> Redirection en cours...';
           }
           alert("Votre évaluation a été enregistrée avec succès !");
           setTimeout(() => {
               showManagerDashboard();
               if (btn) {
                 btn.disabled = false;
                 btn.innerText = "Soumettre l'Évaluation";
               }
               if (status) status.style.display = 'none';
           }, 1500);
        })
        .withFailureHandler(err => {
           if (status) {
             status.style.background = '#ffebee';

  function getEvaluationRowActions(ev, idx) {
    const isCollab = (ev.employeeEmail === currentUser.username || ev.employeeName === currentUser.fullName);
    const isPrincipal = (ev.principalEvaluatorEmail === currentUser.username || ev.principalEvaluatorName === currentUser.fullName || (!ev.principalEvaluatorEmail && ev.evaluatorName === currentUser.fullName) || isUserAdmin());

    let secList = [];
    try { secList = JSON.parse(ev.secondaryEvaluators || '[]'); } catch(e){}
    const mySecEntry = secList.find(s => s.email === currentUser.username || s.name === currentUser.fullName);
    const isSecondary = !!mySecEntry || isUserAdmin();
    const secDone = mySecEntry && mySecEntry.status === 'Complété';

    let badgeClass = 'badge-primary';
    let displayStatus = ev.status;
    if (ev.status === 'Initiée') {
      badgeClass = 'badge-warning';
    } else if (ev.status === 'Attente Évaluateur Secondaire') {
      badgeClass = 'badge-info';
    } else if (ev.status === 'Attente Évaluateur Principal' || ev.status === 'Auto-évaluée') {
      badgeClass = 'badge-primary';
    } else if (ev.status === 'Pré-évaluée') {
      badgeClass = 'badge-info';
    } else if (ev.status === 'Complétée') {
      badgeClass = 'badge-success';
    }

    let actionBtns = `<button class="btn btn-outline" style="padding:5px 10px; font-size:12px;" onclick="viewEvaluation(${idx})">Consulter</button>`;

    if (ev.status === 'Initiée') {
      if (isCollab) {
        actionBtns += ` <button class="btn btn-primary" style="padding:5px 10px; font-size:12px; margin-left:5px; background-color:var(--secondary-color);" onclick="startEvaluationWizard('Auto-évaluation', ${ev.rowId})">Auto-évaluer</button>`;
      }
    } else if (ev.status === 'Attente Évaluateur Secondaire') {
      if (isSecondary && !secDone) {
        actionBtns += ` <button class="btn" style="padding:5px 10px; font-size:12px; margin-left:5px; background-color:#ff9800; color:#fff;" onclick="startEvaluationWizard('Évaluation Secondaire', ${ev.rowId})">Évaluer (Secondaire)</button>`;
      }
      if (isPrincipal || isUserAdmin()) {
        actionBtns += ` <button class="btn btn-outline" style="padding:5px 10px; font-size:12px; margin-left:5px;" onclick="advanceToPrincipal(${ev.rowId})" title="Clôturer l'étape secondaire et passer à l'évaluation principale">Passer au Principal →</button>`;
      }
    } else if (ev.status === 'Attente Évaluateur Principal' || ev.status === 'Auto-évaluée' || ev.status === 'Pré-évaluée') {
      if (isPrincipal || isUserAdmin()) {
        actionBtns += ` <button class="btn" style="padding:5px 10px; font-size:12px; margin-left:5px; background-color:var(--secondary-color); color:#fff;" onclick="startEvaluationWizard('Évaluation Manager', ${ev.rowId})">Évaluer (Principal)</button>`;
      }
    }

    if (ev.status === 'Complétée' && ev.pdfUrl) {
      actionBtns += ` <a href="${ev.pdfUrl}" target="_blank" class="btn btn-outline" style="padding:5px 10px; font-size:12px; margin-left:5px;">Télécharger PDF</a>`;
    }

    return {
      badgeClass: badgeClass,
      displayStatus: displayStatus,
      actionBtns: actionBtns
    };
  }

  function showManagerDashboard() {
    document.getElementById('eval-selection-screen').style.display = 'none';
    document.getElementById('eval-wizard-screen').style.display = 'none';
    document.getElementById('eval-manager-dashboard').style.display = 'block';
    document.getElementById('eval-viewer-screen').style.display = 'none';
    document.getElementById('eval-header-actions').style.display = 'block';

    const isMgr = isUserManagerOrAdmin();
    const dashInitBtn = document.getElementById('manager-dashboard-initiate-btn');
    if (dashInitBtn) dashInitBtn.style.display = isMgr ? 'inline-block' : 'none';

    document.querySelector('#eval-manager-dashboard h3').innerText = "Dossiers d'Évaluation";
    document.getElementById('eval-dashboard-loader').style.display = 'block';
    const tbody = document.querySelector('#evals-table tbody');
    if (tbody) tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Chargement en cours...</td></tr>';
    
    google.script.run
      .withSuccessHandler(function(evalsStr) {
        document.getElementById('eval-dashboard-loader').style.display = 'none';
        try {
          const evals = JSON.parse(evalsStr);
          tbody.innerHTML = '';
          if(!evals || evals.length === 0) {
             tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Aucune évaluation trouvée.</td></tr>';
             return;
          }
          
          if (evals.length > 0 && evals[0].error) {
             tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:red;">Erreur technique: ${evals[0].error}</td></tr>`;
             return;
          }
          
          window.loadedEvals = evals;
          updateNotifications();
          
          evals.forEach((ev, idx) => {
             const tr = document.createElement('tr');
             const rowInfo = getEvaluationRowActions(ev, idx);
             
             tr.innerHTML = `
               <td>${ev.timestamp}</td>
               <td><span class="badge ${rowInfo.badgeClass}">${rowInfo.displayStatus}</span></td>
               <td>${ev.employeeName}</td>
               <td>${ev.principalEvaluatorName || ev.evaluatorName}</td>
               <td><strong>${ev.mgrGlobalRating || ev.globalRating || '-'}</strong></td>
               <td>${rowInfo.actionBtns}</td>

          });
        } catch (e) {
           tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:red;">Erreur Client: ${e.message}</td></tr>`;
        }

         document.getElementById('eval-dashboard-loader').style.display = 'none';
         const tbody = document.querySelector('#evals-table tbody');
         tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:red;">Erreur serveur: ${err.message}</td></tr>`;
      })
      .getNativeEvaluations(window.kanagaToken);

      try { if(ev.fondamentales) empFonda = JSON.parse(ev.fondamentales); } catch(e){}
      try { if(ev.mgrFondamentales) mgrFonda = JSON.parse(ev.mgrFondamentales); } catch(e){}
      try { if(ev.secondaryFondamentales) secFonda = JSON.parse(ev.secondaryFondamentales); } catch(e){}

      const formatSecCompCell = (secEntries, idx) => {
        if (!secEntries || secEntries.length === 0) return '<span class="text-muted">-</span>';
        const parts = [];
        secEntries.forEach(entry => {
          const resp = entry.responses && entry.responses[idx];
          if (resp && resp.answer) {
            const bCls = getEvalBadgeClass(resp.answer);
            const comm = resp.comment || resp.secComment || resp.mgrComment || '';
            parts.push(`
              <div style="margin-bottom:8px;">
                <div style="font-size:11px; font-weight:bold; color:#b25900;">${escapeHtml(entry.evaluatorName || entry.evaluatorEmail)}</div>
                <span class="eval-badge eval-badge-${bCls}">${escapeHtml(resp.answer)}</span>
                ${comm ? `<div style="font-size:11px; color:#333; margin-top:3px; background:#fffcf5; padding:4px 6px; border-radius:3px; border-left:2px solid #ff9800; word-break:break-word;">${escapeHtml(comm)}</div>` : ''}
              </div>
            `);
          }
        });
        return parts.length > 0 ? parts.join('') : '<span class="text-muted">-</span>';
      };
      
      if (empFonda.length > 0 || mgrFonda.length > 0 || secFonda.length > 0) {
          html += `<tr><td colspan="4" style="background:#f5f5f5; font-weight:bold;">Fondamentales</td></tr>`;
          const maxLen = Math.max(empFonda.length, mgrFonda.length);
          for(let i=0; i<maxLen; i++) {
              const empQ = empFonda[i] || {};
              const mgrQ = mgrFonda[i] || {};
              const qText = empQ.question || mgrQ.question || `Question ${i+1}`;
              const empAns = empQ.answer || '-';
              const mgrAns = mgrQ.answer || '-';
              const empComment = empQ.empComment || empQ.comment || '';
              const mgrComment = mgrQ.mgrComment || mgrQ.comment || '';

              const empCommentHtml = empComment ? `<div style="font-size:12px; color:#333; margin-top:6px; background:#f4f9f4; padding:6px 8px; border-radius:4px; border-left:3px solid #28a745; word-break:break-word;"><strong>Commentaire:</strong> ${escapeHtml(empComment)}</div>` : '';
              const mgrCommentHtml = mgrComment ? `<div style="font-size:12px; color:#333; margin-top:6px; background:#f0f5fc; padding:6px 8px; border-radius:4px; border-left:3px solid #0c63e4; word-break:break-word;"><strong>Commentaire:</strong> ${escapeHtml(mgrComment)}</div>` : '';

              html += `<tr>
                <td style="vertical-align: top;"><strong>${escapeHtml(qText)}</strong></td>
                <td style="vertical-align: top;">
                  <span class="eval-badge eval-badge-${getEvalBadgeClass(empAns)}">${escapeHtml(empAns)}</span>
                  ${empCommentHtml}
                </td>
                <td style="vertical-align: top;">
                  ${formatSecCompCell(secFonda, i)}
                </td>
                <td style="vertical-align: top;">
                  <span class="eval-badge eval-badge-${getEvalBadgeClass(mgrAns)}">${escapeHtml(mgrAns)}</span>
                  ${mgrCommentHtml}
                </td>
              </tr>`;
          }
      }
      
      let empSpec = [], mgrSpec = [], secSpec = [];
      try { if(ev.specifiques && ev.specifiques !== "[]") empSpec = JSON.parse(ev.specifiques); } catch(e){}
      try { if(ev.mgrSpecifiques && ev.mgrSpecifiques !== "[]") mgrSpec = JSON.parse(ev.mgrSpecifiques); } catch(e){}
      try { if(ev.secondarySpecifiques && ev.secondarySpecifiques !== "[]") secSpec = JSON.parse(ev.secondarySpecifiques); } catch(e){}
      
      if (empSpec.length > 0 || mgrSpec.length > 0 || secSpec.length > 0) {
          html += `<tr><td colspan="4" style="background:#f5f5f5; font-weight:bold;">Spécifiques (${escapeHtml(ev.profile || 'Profil')})</td></tr>`;
          const maxLen = Math.max(empSpec.length, mgrSpec.length);
          for(let i=0; i<maxLen; i++) {
              const empQ = empSpec[i] || {};
              const mgrQ = mgrSpec[i] || {};
              const qText = empQ.question || mgrQ.question || `Question ${i+1}`;
              const empAns = empQ.answer || '-';
              const mgrAns = mgrQ.answer || '-';
              const empComment = empQ.empComment || empQ.comment || '';
              const mgrComment = mgrQ.mgrComment || mgrQ.comment || '';

              const empCommentHtml = empComment ? `<div style="font-size:12px; color:#333; margin-top:6px; background:#f4f9f4; padding:6px 8px; border-radius:4px; border-left:3px solid #28a745; word-break:break-word;"><strong>Commentaire:</strong> ${escapeHtml(empComment)}</div>` : '';
              const mgrCommentHtml = mgrComment ? `<div style="font-size:12px; color:#333; margin-top:6px; background:#f0f5fc; padding:6px 8px; border-radius:4px; border-left:3px solid #0c63e4; word-break:break-word;"><strong>Commentaire:</strong> ${escapeHtml(mgrComment)}</div>` : '';

              html += `<tr>
                <td style="vertical-align: top;"><strong>${escapeHtml(qText)}</strong></td>
                <td style="vertical-align: top;">
                  <span class="eval-badge eval-badge-${getEvalBadgeClass(empAns)}">${escapeHtml(empAns)}</span>
                  ${empCommentHtml}
                </td>
                <td style="vertical-align: top;">
                  ${formatSecCompCell(secSpec, i)}
                </td>
                <td style="vertical-align: top;">
                  <span class="eval-badge eval-badge-${getEvalBadgeClass(mgrAns)}">${escapeHtml(mgrAns)}</span>
                  ${mgrCommentHtml}
                </td>
              </tr>`;
          }
      }
      
      html += `</tbody></table></div>`;
      
      html += `
        <div class="eval-viewer-box" style="margin-top:20px;"><strong>Commentaires Généraux Employé:</strong><br>${(ev.empComments || '-').replace(/\n/g, '<br>')}</div>
        <div class="eval-viewer-box" style="margin-bottom:10px;"><strong>Commentaires Généraux Manager / Principal:</strong><br>${(ev.mgrComments || '-').replace(/\n/g, '<br>')}</div>
      `;
     }
     
     // Actions contextuelles en bas de fiche
     const isPrincipalUser = (ev.principalEvaluatorEmail === currentUser.username || ev.principalEvaluatorName === currentUser.fullName || (!ev.principalEvaluatorEmail && ev.evaluatorName === currentUser.fullName) || isUserAdmin());
     const mySecUser = secList.find(s => s.email === currentUser.username || s.name === currentUser.fullName);
     const isSecUser = !!mySecUser || isUserAdmin();
     const secUserDone = mySecUser && mySecUser.status === 'Complété';

     if (ev.status === 'Attente Évaluateur Secondaire') {
       let bottomActions = '';
       if (isSecUser && !secUserDone) {
         bottomActions += `<button class="btn" style="background-color:#ff9800; color:#fff; margin-right:10px;" onclick="startEvaluationWizard('Évaluation Secondaire', ${ev.rowId})">Évaluer en tant qu'évaluateur secondaire</button>`;
       }
       if (isPrincipalUser) {
         bottomActions += `<button class="btn btn-outline" onclick="advanceToPrincipal(${ev.rowId})">Passer immédiatement à l'évaluation principale →</button>`;
       }
       if (bottomActions) {
         html += `
           <div style="margin-top:30px; padding:20px; background:#fffcf5; text-align:center; border:1px dashed #ff9800; border-radius:6px;">
             <p style="margin-bottom:15px; color:#555;">Phase d'évaluation secondaire en cours.</p>
             ${bottomActions}
           </div>
         `;
       }
     } else if (ev.status === 'Attente Évaluateur Principal' || ev.status === 'Auto-évaluée') {
       if (isPrincipalUser) {
         html += `
           <div style="margin-top:30px; padding:20px; background:#f0f5fc; text-align:center; border:1px dashed var(--primary-color); border-radius:6px;">
             <p style="margin-bottom:15px; color:#555;">Ce dossier est prêt pour votre évaluation finale.</p>
             <button class="btn btn-success" onclick="startEvaluationWizard('Évaluation Manager', ${ev.rowId})">Évaluer en tant qu'évaluateur principal</button>
           </div>
         `;
       }
     } else if (ev.status === 'Complétée' && isPrincipalUser) {
       html += `
         <div style="margin-top:30px; padding:20px; background:#f9f9f9; text-align:center; border:1px dashed #ccc; border-radius:6px;">
           <p style="margin-bottom:15px; color:#555;">Ce dossier est complété (Évaluateur principal: ${ev.principalEvaluatorName || ev.mgrName || ev.evaluatorName}).</p>
           <button class="btn btn-outline" onclick="startEvaluationWizard('Évaluation Manager', ${ev.rowId})">Modifier / Compléter l'évaluation</button>
         </div>
       `;
     }
     
     document.getElementById('eval-viewer-content').innerHTML = html;
  }

  // --- Administration Logic ---
  
  function switchAdminTab(tabId) {
      if (!isUserAdmin() && (tabId === 'country-groups' || tabId === 'users' || tabId === 'email')) {
          tabId = 'questions';
      }

      document.querySelectorAll('.admin-panel').forEach(p => p.style.display = 'none');
      document.querySelectorAll('.admin-tab').forEach(b => {
          b.style.background = '#f0f0f0';
          b.style.color = '#333';
      });
      
      const panel = document.getElementById('admin-panel-' + tabId);
      if (panel) panel.style.display = 'block';

      const activeBtn = document.getElementById('tab-btn-' + tabId);
      if (activeBtn) {
        activeBtn.style.background = 'var(--primary-color)';
        activeBtn.style.color = 'white';
      }

      if (tabId === 'country-groups') {
        if (isUserAdmin()) loadAdminCountryGroups();
      } else if (tabId === 'email') {
        loadEvaluationNotificationSettings();
      }
