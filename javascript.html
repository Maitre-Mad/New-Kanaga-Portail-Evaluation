  function getCurrentAdminPageTitle(profile, pageNum) {
      if (!adminEvalConfigData || !adminEvalConfigData[profile]) return '';
      const q = adminEvalConfigData[profile].find(item => (parseInt(item.page, 10) || 1) === pageNum && item.pageTitle);
      return q ? (q.pageTitle || '').trim() : '';
  }

  function updateCurrentAdminPageTitle(newTitle) {
      const profile = document.getElementById('admin-profile-select').value;
      if (!profile || !adminEvalConfigData[profile]) return;
      const questions = adminEvalConfigData[profile];
      const cleanTitle = (newTitle || '').trim();
      let matched = false;
      questions.forEach(q => {
          if ((parseInt(q.page, 10) || 1) === adminCurrentPage) {
              q.pageTitle = cleanTitle;
              matched = true;
          }
      });
      if (!matched) {
          questions.push({
              text: "Nouvelle compétence (" + (cleanTitle || "Page " + adminCurrentPage) + ")",
              description: "",
              type: "scale",
              options: "PI, PA, CA, PS, PE, N/A",
              page: adminCurrentPage,
              pageTitle: cleanTitle
          });
      }
      // Mettre à jour l'intitulé de l'onglet actif
      const tabsContainer = document.getElementById('admin-pages-tabs-container');
      if (tabsContainer) {
          const pageNums = Array.from(new Set(questions.map(q => parseInt(q.page, 10) || 1))).sort((a,b) => a - b);
          tabsContainer.innerHTML = '';
          pageNums.forEach(p => {
              const pCount = questions.filter(q => (parseInt(q.page, 10) || 1) === p).length;
              const pQWithTitle = questions.find(q => (parseInt(q.page, 10) || 1) === p && q.pageTitle);
              const pTitle = pQWithTitle ? pQWithTitle.pageTitle.trim() : '';
              const tabLabel = pTitle ? `Page ${p} : ${pTitle} (${pCount})` : `Page ${p} (${pCount})`;
              const btn = document.createElement('button');
              btn.type = 'button';
              btn.className = 'btn';
              btn.style.cssText = `padding: 5px 12px; font-size: 12px; font-weight: 600; border-radius: 4px; cursor: pointer; ` +
                (p === adminCurrentPage
                  ? `background: var(--primary-color); color: white; border: 1px solid var(--primary-color);`
                  : `background: white; color: #4A5568; border: 1px solid #CBD5E0;`);
              btn.textContent = tabLabel;
              btn.title = pTitle ? `Page ${p} : ${pTitle}` : `Page ${p}`;
              btn.onclick = function() {
                adminCurrentPage = p;
                renderAdminFormBuilder();
              };
              tabsContainer.appendChild(btn);
          });
      }
      markAdminQuestionsUnsaved();
  }

  function addAdminProfilePage() {
      const profile = document.getElementById('admin-profile-select').value;
      if (!profile || !adminEvalConfigData[profile]) return;
      const questions = adminEvalConfigData[profile];
      const maxPage = questions.reduce((max, q) => Math.max(max, parseInt(q.page, 10) || 1), 1);
      const newPage = maxPage + 1;
      adminCurrentPage = newPage;
      questions.push({
          text: "Nouvelle compétence (Page " + newPage + ")",
          description: "",
          type: "scale",
          options: "PI, PA, CA, PS, PE, N/A",
          page: newPage,
          pageTitle: ""
      });
      markAdminQuestionsUnsaved();
      renderAdminFormBuilder();
  }

  function deleteCurrentAdminProfilePage() {
      const profile = document.getElementById('admin-profile-select').value;
      if (!profile || !adminEvalConfigData[profile]) return;
      const questions = adminEvalConfigData[profile];
      const pageNums = Array.from(new Set(questions.map(q => parseInt(q.page, 10) || 1))).sort((a,b) => a - b);
      if (pageNums.length <= 1) {
          alert("Le profil doit comporter au moins une page.");
          return;
      }
      if (confirm("Voulez-vous supprimer la Page " + adminCurrentPage + " ? Les questions de cette page seront déplacées vers la Page 1.")) {
          questions.forEach(q => {
              if ((parseInt(q.page, 10) || 1) === adminCurrentPage) {
                  q.page = 1;
              }
          });
          adminCurrentPage = 1;
          markAdminQuestionsUnsaved();
          renderAdminFormBuilder();
      }
  }

  function changeQuestionPage(globalIdx, newPage) {
      const profile = document.getElementById('admin-profile-select').value;
      if (!profile || !adminEvalConfigData[profile] || !adminEvalConfigData[profile][globalIdx]) return;
      if (newPage === 'new') {
          const questions = adminEvalConfigData[profile];
          const maxPage = questions.reduce((max, q) => Math.max(max, parseInt(q.page, 10) || 1), 1);
          const targetPage = maxPage + 1;
          adminEvalConfigData[profile][globalIdx].page = targetPage;
          adminCurrentPage = targetPage;
      } else {
          adminEvalConfigData[profile][globalIdx].page = parseInt(newPage, 10) || 1;
      }
      markAdminQuestionsUnsaved();
      renderAdminFormBuilder();
  }

  function moveAdminQuestion(idx, direction) {
      const profile = document.getElementById('admin-profile-select').value;
      if (!profile || !adminEvalConfigData[profile]) return;
      const list = adminEvalConfigData[profile];
      const targetIdx = idx + direction;
      if (targetIdx < 0 || targetIdx >= list.length) return;
      const temp = list[idx];
      list[idx] = list[targetIdx];
      list[targetIdx] = temp;
      markAdminQuestionsUnsaved();
      renderAdminFormBuilder();
  }

  function updateAdminQuestion(idx, field, value) {
      const profile = document.getElementById('admin-profile-select').value;
      if (adminEvalConfigData[profile] && adminEvalConfigData[profile][idx]) {
          adminEvalConfigData[profile][idx][field] = value;
          markAdminQuestionsUnsaved();
          if (field === 'type' || field === 'page') {
              renderAdminFormBuilder();
          }
      }
  }

  function addAdminFormQuestion() {
      const profile = document.getElementById('admin-profile-select').value;
      if (!profile || !adminEvalConfigData[profile]) return;
      
      const curTitle = getCurrentAdminPageTitle(profile, adminCurrentPage);
      adminEvalConfigData[profile].push({
          text: "Nouvelle compétence spécifique",
          description: "",
          type: "scale",
          options: "PI, PA, CA, PS, PE, N/A",
          page: adminCurrentPage,
          pageTitle: curTitle || ""
      });
      markAdminQuestionsUnsaved();
      renderAdminFormBuilder();
  }

  // Fonctions de gestion de la réutilisation / importation de page inter-profils
  function openReusePageModal() {
      const targetProfile = document.getElementById('admin-profile-select').value;
      if (!targetProfile || !adminEvalConfigData[targetProfile]) {
          alert("Veuillez sélectionner un profil cible.");
          return;
      }
      const label = document.getElementById('reuse-target-profile-name');
      if (label) label.textContent = targetProfile;

      const srcSelect = document.getElementById('reuse-source-profile-select');
      if (!srcSelect) return;
      srcSelect.innerHTML = '';

      const allProfiles = Object.keys(adminEvalConfigData);
      allProfiles.forEach(p => {
          const opt = document.createElement('option');
          opt.value = p;
          opt.textContent = (p === targetProfile) ? `${p} (même profil)` : p;
          srcSelect.appendChild(opt);
      });

      const otherProfile = allProfiles.find(p => p !== targetProfile);
      if (otherProfile) {
          srcSelect.value = otherProfile;
      }

      onReuseSourceProfileChange();

      const modal = document.getElementById('admin-reuse-page-modal');
      if (modal) modal.style.display = 'block';
  }

  function closeReusePageModal() {
      const modal = document.getElementById('admin-reuse-page-modal');
      if (modal) modal.style.display = 'none';
  }

  function onReuseSourceProfileChange() {
      const srcSelect = document.getElementById('reuse-source-profile-select');
      const pageSelect = document.getElementById('reuse-source-page-select');
      if (!srcSelect || !pageSelect) return;
      const srcProfile = srcSelect.value;
      pageSelect.innerHTML = '';

      if (!adminEvalConfigData[srcProfile]) return;
      const questions = adminEvalConfigData[srcProfile];
      let pageNums = Array.from(new Set(questions.map(q => parseInt(q.page, 10) || 1))).sort((a,b) => a - b);
      if (pageNums.length === 0) pageNums.push(1);

      pageNums.forEach(p => {
          const pQWithTitle = questions.find(q => (parseInt(q.page, 10) || 1) === p && q.pageTitle);
          const pTitle = pQWithTitle ? pQWithTitle.pageTitle.trim() : '';
          const pCount = questions.filter(q => (parseInt(q.page, 10) || 1) === p).length;
          const opt = document.createElement('option');
          opt.value = p;
          opt.textContent = pTitle ? `Page ${p} : ${pTitle} (${pCount} question${pCount > 1 ? 's' : ''})` : `Page ${p} (${pCount} question${pCount > 1 ? 's' : ''})`;
          pageSelect.appendChild(opt);
      });

      onReuseSourcePageChange();
  }

  function onReuseSourcePageChange() {
      const srcSelect = document.getElementById('reuse-source-profile-select');
      const pageSelect = document.getElementById('reuse-source-page-select');
      const titleInput = document.getElementById('reuse-page-title-input');
      const previewList = document.getElementById('reuse-questions-preview');
      if (!srcSelect || !pageSelect) return;

      const srcProfile = srcSelect.value;
      const srcPage = parseInt(pageSelect.value, 10) || 1;
      const questions = adminEvalConfigData[srcProfile] || [];
      const pageQuestions = questions.filter(q => (parseInt(q.page, 10) || 1) === srcPage);

      const pQWithTitle = pageQuestions.find(q => q.pageTitle);
      const pTitle = pQWithTitle ? pQWithTitle.pageTitle.trim() : '';
      if (titleInput) {
          titleInput.value = pTitle;
      }

      if (previewList) {
          previewList.innerHTML = '';
          if (pageQuestions.length === 0) {
              previewList.innerHTML = '<li style="color:#A0AEC0;">Aucune question sur cette page</li>';
          } else {
              pageQuestions.forEach(q => {
                  const li = document.createElement('li');
                  li.style.marginBottom = '4px';
                  li.textContent = `${q.text || 'Sans titre'} [${q.type || 'scale'}]`;
                  previewList.appendChild(li);
              });
          }
      }
  }

  function confirmReusePage() {
      const targetProfile = document.getElementById('admin-profile-select').value;
      const srcProfile = document.getElementById('reuse-source-profile-select').value;
      const srcPage = parseInt(document.getElementById('reuse-source-page-select').value, 10) || 1;
      const customTitle = (document.getElementById('reuse-page-title-input').value || '').trim();
      const modeRadio = document.querySelector('input[name="reuse-import-mode"]:checked');
      const mode = modeRadio ? modeRadio.value : 'new_page';

      if (!adminEvalConfigData[srcProfile] || !adminEvalConfigData[targetProfile]) {
          alert("Profil source ou cible invalide.");
          return;
      }

      const srcQuestions = adminEvalConfigData[srcProfile].filter(q => (parseInt(q.page, 10) || 1) === srcPage);
      if (srcQuestions.length === 0) {
          alert("La page source sélectionnée ne contient aucune question.");
          return;
      }

      const targetList = adminEvalConfigData[targetProfile];
      let destPageNum = adminCurrentPage;
      if (mode === 'new_page') {
          const maxPage = targetList.reduce((max, q) => Math.max(max, parseInt(q.page, 10) || 1), 0);
          destPageNum = maxPage + 1;
      }

      const clonedQuestions = srcQuestions.map(q => ({
          text: q.text,
          description: q.description || '',
          type: q.type || 'scale',
          options: q.options || 'INSATIS, AMELIOR, CONFORM, SUPERIE, EXCEPTI, NONAPPL',
          page: destPageNum,
          pageTitle: customTitle || (q.pageTitle || '')
      }));

      if (mode === 'current_page' && customTitle) {
          targetList.forEach(q => {
              if ((parseInt(q.page, 10) || 1) === destPageNum) {
                  q.pageTitle = customTitle;
              }
          });
      }

      targetList.push(...clonedQuestions);
      adminCurrentPage = destPageNum;
      markAdminQuestionsUnsaved();
      closeReusePageModal();
      renderAdminFormBuilder();

      alert(`${clonedQuestions.length} question(s) importée(s) avec succès sur la Page ${destPageNum} de "${targetProfile}".`);
  }

  function deleteAdminFormQuestion(idx) {
      const profile = document.getElementById('admin-profile-select').value;
      if (!profile || !adminEvalConfigData[profile]) return;
      
      if (confirm(`Voulez-vous supprimer la question n° ${idx + 1} ?`)) {
        adminEvalConfigData[profile].splice(idx, 1);
        markAdminQuestionsUnsaved();
        renderAdminFormBuilder();
      }
  }

  function confirmAddProfile() {
      const nameInput = document.getElementById('admin-new-profile-name');
      let name = (nameInput ? nameInput.value : '').trim();
      if (!name) {
          alert("Veuillez entrer un nom pour le nouveau profil.");
          return;
      }
      if (name.toLowerCase() === 'fondamentales' || name.toLowerCase() === 'autre' || name.toLowerCase() === 'conclusion') {
          alert("Ce nom de profil est réservé par le système.");
          return;
      }
      for (const key in adminEvalConfigData) {
          if (key.toLowerCase().trim() === name.toLowerCase().trim()) {
              alert(`Le profil "${key}" existe déjà.`);
              return;
          }
      }
      
      const cloneSelect = document.getElementById('admin-clone-profile-select');
      const cloneFrom = cloneSelect ? cloneSelect.value : '';
      if (cloneFrom && adminEvalConfigData[cloneFrom]) {
          adminEvalConfigData[name] = JSON.parse(JSON.stringify(adminEvalConfigData[cloneFrom]));
      } else {
          adminEvalConfigData[name] = [{
              text: "1. Compétence technique / métier",
              description: "Critères d'évaluation de la performance attendue pour ce poste",
              type: "scale",
              options: "PI, PA, CA, PS, PE, N/A"
          }];
      }
      
      closeAddProfileModal();
      updateAdminProfileSelect(name);
  }

  function duplicateAdminProfile() {
      const select = document.getElementById('admin-profile-select');
      const current = select.value;
      if (!current || current === 'fondamentales' || current === 'conclusion' || !adminEvalConfigData[current]) return;
      
      let cloneName = prompt(`Nom du nouveau profil dupliqué depuis "${current}" :`, `${current} (Copie)`);
      if (!cloneName) return;
      cloneName = cloneName.trim();
      for (const key in adminEvalConfigData) {
          if (key.toLowerCase().trim() === cloneName.toLowerCase().trim()) {
              alert("Un profil portant ce nom existe déjà.");
              return;
          }
      }
      adminEvalConfigData[cloneName] = JSON.parse(JSON.stringify(adminEvalConfigData[current]));
      updateAdminProfileSelect(cloneName);
  }

  function openRenameProfileModal() {
      const select = document.getElementById('admin-profile-select');
      const current = select.value;
      if (!current || current === 'fondamentales' || current === 'conclusion') return;
      const input = document.getElementById('admin-rename-profile-name');
      if (input) input.value = current;
      const modal = document.getElementById('admin-rename-profile-modal');
      if (modal) modal.style.display = 'block';
  }

  function closeRenameProfileModal() {
      const modal = document.getElementById('admin-rename-profile-modal');
      if (modal) modal.style.display = 'none';
  }

  function confirmRenameProfile() {
      const select = document.getElementById('admin-profile-select');
      const oldKey = select.value;
      const input = document.getElementById('admin-rename-profile-name');
      const newKey = (input ? input.value : '').trim();
      if (!newKey || oldKey === newKey) {
          closeRenameProfileModal();
          return;
      }
      if (newKey.toLowerCase() === 'fondamentales' || newKey.toLowerCase() === 'autre' || newKey.toLowerCase() === 'conclusion') {
          alert("Ce nom de profil est réservé par le système.");
          return;
      }
      for (const k in adminEvalConfigData) {
          if (k !== oldKey && k.toLowerCase().trim() === newKey.toLowerCase().trim()) {
              alert(`Un profil portant le nom "${k}" existe déjà.`);
              return;
          }
      }
      
      const newConfig = {};
      for (const k in adminEvalConfigData) {
          if (k === oldKey) {
              newConfig[newKey] = adminEvalConfigData[oldKey];
          } else {
              newConfig[k] = adminEvalConfigData[k];
          }
      }
      adminEvalConfigData = newConfig;
      closeRenameProfileModal();
      markAdminQuestionsUnsaved();
      updateAdminProfileSelect(newKey);
  }

  function deleteAdminProfile() {
      const select = document.getElementById('admin-profile-select');
      const val = select.value;
      if (!val || val === 'fondamentales' || val === 'conclusion' || !adminEvalConfigData[val]) return;
      
      if (confirm(`Voulez-vous vraiment supprimer définitivement le profil "${val}" et toutes ses questions spécifiques ?`)) {
          delete adminEvalConfigData[val];
          markAdminQuestionsUnsaved();
          updateAdminProfileSelect('fondamentales');
      }
  }

  function saveAdminQuestionsConfig() {
      const btnTop = document.getElementById('btn-save-questions');
      const btnBottom = document.getElementById('btn-save-questions-bottom');
      const status = document.getElementById('questions-status-msg');
      const unsavedBadge = document.getElementById('admin-unsaved-badge');

      if (btnTop) {
        btnTop.disabled = true;
        btnTop.innerText = "Enregistrement sur la feuille...";
      }
      if (btnBottom) {
        btnBottom.disabled = true;
        btnBottom.innerText = "Enregistrement sur la feuille...";
      }
      if (status) {
        status.innerText = "⏳ Enregistrement de la configuration et des pages sur la feuille EvaluationQuestions...";
        status.style.color = "var(--primary-color)";
      }
      // Enregistrer également les intitulés d'étapes s'ils sont renseignés
      const in1 = document.getElementById('admin-step1-name');
      const in2 = document.getElementById('admin-step2-name');
      const in3 = document.getElementById('admin-step3-name');
      const in4 = document.getElementById('admin-step4-name');
      if (in1 && in2 && in3 && in4) {
        const titlesToSave = {
          step1: (in1.value || "1. Entonnoir (Infos)").trim(),
          step2: (in2.value || "2. Tronc Commun").trim(),
          step3: (in3.value || "3. Aiguillage Profil").trim(),
          step4: (in4.value || "4. Réunion Finale").trim()
        };
        google.script.run.saveEvaluationStepTitles(window.kanagaToken, titlesToSave);
        applyEvaluationStepTitles(titlesToSave);
      }

      google.script.run
        .withSuccessHandler(function(res) {
            if (btnTop) {
              btnTop.disabled = false;
              btnTop.innerText = "Enregistrer la Configuration";
            }
            if (btnBottom) {
              btnBottom.disabled = false;
              btnBottom.innerText = "Enregistrer la Configuration";
            }
            if (unsavedBadge) unsavedBadge.style.display = 'none';
            if (status) {
              status.innerText = "Configuration et pages enregistrées avec succès sur la feuille EvaluationQuestions !";
              status.style.color = "green";
              setTimeout(() => { if (status) status.innerText = ""; }, 5000);
            }
            alert("La configuration des questions et de leurs pages a été enregistrée avec succès sur la feuille EvaluationQuestions !");
            google.script.run.withSuccessHandler(function(c) {
                evalQuestions = c;
                loadEvaluationData(); // Rafraîchit les options du sélecteur de profils du formulaire
            }).getEvaluationConfig(window.kanagaToken);
        })
        .withFailureHandler(function(err) {
            if (btnTop) {
              btnTop.disabled = false;
              btnTop.innerText = "Enregistrer la Configuration";
            }
            if (btnBottom) {
              btnBottom.disabled = false;
              btnBottom.innerText = "Enregistrer la Configuration";
            }
            if (status) {
              status.innerText = "Erreur lors de l'enregistrement : " + err.message;
              status.style.color = "var(--danger-color)";
            }
            alert("Erreur lors de l'enregistrement sur la feuille : " + err.message);
        })
        .saveEvaluationConfig(window.kanagaToken, adminEvalConfigData);
  }

  function updateNotifications() {
    if(!window.loadedEvals || !currentUser) return;
    
    const badge = document.getElementById('notification-badge');
    const avatarBadge = document.getElementById('avatar-notification-badge');
    const list = document.getElementById('dropdown-notifications-list');
    
    if (!badge || !avatarBadge || !list) return; // Protection si les éléments DOM sont absents
    
    let pendingEvals = window.loadedEvals.filter(ev => 
      ev.employeeEmail === currentUser.username && ev.status === 'Initiée'
    );
    
    // Si l'utilisateur est manager, ajouter les auto-évaluées et pré-évaluées en attente
    if(isUserManagerOrAdmin()) {
       const mgrPending = window.loadedEvals.filter(ev => 
          (ev.status === 'Auto-évaluée' || ev.status === 'Pré-évaluée') && !ev.mgrName
       );
       pendingEvals = pendingEvals.concat(mgrPending);
    }
    
    const count = pendingEvals.length;
    
    if (count > 0) {
      badge.innerText = count;
      avatarBadge.innerText = count;
      avatarBadge.style.display = 'inline-block';
      
      let html = '';
      pendingEvals.forEach(ev => {
         let msg = '';
         if(ev.employeeEmail === currentUser.username && ev.status === 'Initiée') {
            msg = `Évaluation (${ev.period}) en attente de votre auto-évaluation.`;
         } else {
            msg = `Auto-évaluation de ${ev.employeeName} (${ev.period}) en attente de votre revue.`;
         }
         html += `<div style="padding:10px 15px; border-bottom:1px solid #eee; cursor:pointer;" onclick="navigateTo('evaluation'); toggleProfileMenu();">
                    ${msg}
                  </div>`;
      });
      list.innerHTML = html;
    } else {
      badge.innerText = '0';
      avatarBadge.style.display = 'none';
      list.innerHTML = `<div style="padding:10px 15px;">Aucune notification</div>`;
    }
  }

    google.script.run
      .withSuccessHandler(data => {
        if (loader) loader.style.display = 'none';

        if (data && data.hasAccess === false) {
          if (errorMsg) {
            errorMsg.style.display = 'block';
            errorMsg.textContent = "Accès restreint : Votre compte ne fait pas partie du groupe d'administration autorisé pour ce pays.";
          }
          return;
        }
        
        window.responsesState.headers = data.headers || [];
        window.responsesState.responses = data.responses || [];
        window.responsesState.filteredResponses = data.responses || [];
        window.responsesState.bureaux = data.bureaux || [];
        window.responsesState.afColIndex = data.afColIndex >= 0 ? data.afColIndex : 31;
        window.responsesState.isAdmin = data.isAdmin || false;

        const bureauFilterContainer = document.getElementById('bureau-filter-container');
        const bureauSelect = document.getElementById('responses-bureau-select');
        const allowedBureaux = data.showBureauSelector ? (data.isAdmin ? data.bureaux : (data.userAllowedBureaux || [])) : [];

        if (bureauFilterContainer && bureauSelect && allowedBureaux.length > 1) {
          bureauFilterContainer.style.display = 'block';
          let selectHtml = '<option value="ALL">Tous mes bureaux (' + allowedBureaux.length + ')</option>';

            const isSelected = (window.responsesState.selectedBureau === b) ? 'selected' : '';

          });
          bureauSelect.innerHTML = selectHtml;
        } else if (bureauFilterContainer) {
          bureauFilterContainer.style.display = 'none';
        }

        renderResponsesTable();

          errorMsg.textContent = "Erreur de chargement: " + err.message;

  function renderResponsesTable() {
    const tableContainer = document.getElementById('responses-table-container');
    const headerTr = document.getElementById('responses-table-header');
    const tbody = document.getElementById('responses-table-body');
    const badge = document.getElementById('responses-count-badge');

    if (!tbody || !headerTr) return;

    const headers = window.responsesState.headers;
    const responses = window.responsesState.filteredResponses;
    const afIndex = window.responsesState.afColIndex;

    if (badge) {
      badge.textContent = responses.length + (responses.length > 1 ? ' réponses' : ' réponse');
    }

    if (headers.length === 0 || responses.length === 0) {
      if (tableContainer) tableContainer.style.display = 'block';
      tbody.innerHTML = '<tr><td colspan="10" style="text-align: center; color: #888; padding: 20px;">Aucune réponse trouvée pour les critères choisis.</td></tr>';
      return;
    }

    const timestampHeader = headers[0] || 'Horodateur';
    const bureauHeader = (afIndex >= 0 && afIndex < headers.length) ? headers[afIndex] : 'Bureau Kanaga';
    
    let extraCols = [];
    for (let i = 1; i < headers.length; i++) {
      if (i !== afIndex && extraCols.length < 3) {
        extraCols.push(i);
      }
    }

    let headerHtml = `<th>${escapeHtml(timestampHeader)}</th>`;
    headerHtml += `<th>${escapeHtml(bureauHeader)}</th>`;
    extraCols.forEach(colIdx => {
      headerHtml += `<th>${escapeHtml(headers[colIdx] || ('Col ' + (colIdx + 1)))}</th>`;
    });
    headerHtml += `<th style="text-align: center;">Actions</th>`;
    headerTr.innerHTML = headerHtml;

    let bodyHtml = '';
    responses.forEach((item, rIdx) => {
      const timestamp = item.values[0] || '';
      const bureauVal = item.bureau || (afIndex >= 0 ? item.values[afIndex] : '');

      bodyHtml += `<tr>`;
      bodyHtml += `<td><strong>${escapeHtml(timestamp)}</strong></td>`;
      bodyHtml += `<td><span class="badge" style="background: #e2e8f0; color: #2d3748; font-weight: 600;">${escapeHtml(bureauVal || 'N/A')}</span></td>`;
      
      extraCols.forEach(colIdx => {
        const val = item.values[colIdx] || '';
        const shortVal = val.length > 50 ? val.substring(0, 50) + '...' : val;
        bodyHtml += `<td title="${escapeHtml(val)}">${escapeHtml(shortVal)}</td>`;
      });

      bodyHtml += `<td style="text-align: center;">
        <button class="btn btn-outline btn-sm" onclick="openResponseDetailModal(${rIdx})">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 3px; vertical-align: middle;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          Détails
        </button>
      </td>`;
      bodyHtml += `</tr>`;
    });

    tbody.innerHTML = bodyHtml;
    if (tableContainer) tableContainer.style.display = 'block';
  }

  function getRespondentName(headers, values) {
    if (!headers || !values) return '';

    let fullName = '';
    let nom = '';
    let prenom = '';
    let email = '';

    headers.forEach((h, idx) => {
      if (!h) return;
      const lower = h.toLowerCase().trim();
      const val = String(values[idx] || '').trim();
      if (!val) return;

      if (lower.includes('nom complet') || lower.includes('nom et prénom') || lower.includes('nom et prenom') || lower.includes('nom & prénom')) {
        if (!fullName) fullName = val;
      } else if (lower === 'nom' || lower.includes('votre nom') || lower.endsWith(' nom')) {
        if (!nom) nom = val;
      } else if (lower.includes('prénom') || lower.includes('prenom')) {
        if (!prenom) prenom = val;
      } else if (lower.includes('email') || lower.includes('e-mail') || lower.includes('courriel')) {
        if (!email) email = val;
      }
    });

    if (fullName) return fullName;
    if (prenom && nom) return prenom + ' ' + nom;
    if (nom) return nom;
    if (prenom) return prenom;
    if (email) return email;

    return '';
  }

          .card-date { font-size: 12px; color: #633A10; }
          .card-body { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
          .qa-item { padding: 14px 16px; border-radius: 6px; page-break-inside: avoid; }
          .q-title { font-weight: 700; font-size: 12px; color: #7C4C26; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.4px; }
          .a-text { font-size: 13px; color: #2D1A0A; white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
          .footer { margin-top: 30px; font-size: 11px; color: #7C4C26; text-align: center; border-top: 2px solid #E0CC99; padding-top: 15px; font-weight: 500; }
          @media print {
            body { background: white; padding: 0; }
            .no-print { display: none !important; }
            .response-card { box-shadow: none; border: 1px solid #7C4C26; }
          }
        </style>
      </head>
      <body>
        <div class="no-print">
          <span style="font-weight: 600; color: #7C4C26; font-size: 14px;">Rapport d'export PDF Kanaga Consulting (${responses.length} réponses)</span>
          <button onclick="window.print()" style="background: #7C4C26; color: white; border: none; padding: 10px 22px; font-size: 13px; font-weight: bold; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 8px;">Enregistrer au format PDF / Imprimer</button>
        </div>

        <div class="doc-header">
          <div>
            <h1 class="doc-title">Kanaga Consulting — Rapport des Réponses</h1>
            <div class="doc-subtitle">Bureau: <strong>${escapeHtml(bureauText)}</strong> ${hideEmpty ? '<span style="color:#ef4444; margin-left:10px;">(Questions non renseignées masquées)</span>' : ''}</div>
          </div>
          <div>
            <span class="badge">${responses.length} réponse(s) — ${dateStr}</span>
          </div>
        </div>

        ${responsesHtml}

        <div class="footer">
          Document officiel généré depuis le Portail Kanaga Consulting
        </div>
      </body>
      </html>
    `;

    printWin.document.open();
    printWin.document.write(htmlContent);
    printWin.document.close();
    setTimeout(() => {
      try {
        printWin.focus();
        printWin.print();
      } catch(e) {}
    }, 500);
  }

  function exportSingleResponseToPDF() {
    const idx = window.currentActiveDetailIndex;
    if (idx === undefined || idx === null) return;
    const item = window.responsesState.filteredResponses[idx];
    if (!item) return;

    const headers = window.responsesState.headers;
    const values = item.values;
    const afIndex = window.responsesState.afColIndex;

    const personName = getRespondentName(headers, values);
    const bureauVal = item.bureau || (afIndex >= 0 ? values[afIndex] : 'Kanaga');

    const modalHideCheckbox = document.getElementById('modal-hide-empty-pdf');
    const mainHideCheckbox = document.getElementById('responses-hide-empty-pdf');
    const hideEmpty = (modalHideCheckbox && modalHideCheckbox.checked) || (mainHideCheckbox && mainHideCheckbox.checked) || false;

    const printWin = window.open('', '_blank');
    if (!printWin) {
      alert("Veuillez autoriser les fenêtres surgissantes (pop-ups) pour imprimer / exporter en PDF.");
      return;
    }

    const dateStr = new Date().toLocaleDateString('fr-FR', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    const displayName = personName || (`Réponse #${item.rowIndex}`);

    let qaPairsHtml = '';
    headers.forEach((h, qIdx) => {
      const rawVal = values[qIdx];
      const valStr = String(rawVal !== null && rawVal !== undefined ? rawVal : '').trim();

      if (hideEmpty && (!valStr || valStr === 'Non renseigné')) {
        return;
      }

      const isAf = (qIdx === afIndex);
      const cardStyle = isAf ? 'border-left: 4px solid #7C4C26; background: #F5EFEB;' : 'background: #ffffff; border: 1px solid #E0CC99;';

      qaPairsHtml += `
        <div class="qa-item" style="${cardStyle}">
          <div class="q-title">${escapeHtml(h || ('Question ' + (qIdx + 1)))}</div>
          <div class="a-text">${valStr ? escapeHtml(valStr) : '<em style="color: #a0aec0;">Non renseigné</em>'}</div>
        </div>
      `;
    });

    const htmlContent = `
      <!DOCTYPE html>
      <html lang="fr">
      <head>
        <meta charset="UTF-8">
        <title>Fiche Individuelle de Réponse - ${escapeHtml(displayName)}</title>
        <style>
          @page { size: A4 portrait; margin: 15mm; }
          body { font-family: 'Segoe UI', 'Inter', Arial, sans-serif; font-size: 12px; color: #2D1A0A; margin: 0; padding: 20px; background: #F8F6F0; }
          .no-print { display: flex; justify-content: space-between; align-items: center; background: white; padding: 14px 22px; border-radius: 8px; border: 1px solid #E0CC99; box-shadow: 0 2px 8px rgba(124,76,38,0.08); margin-bottom: 20px; }
          .doc-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #7C4C26; padding-bottom: 15px; margin-bottom: 25px; background: white; padding: 22px 26px; border-radius: 8px; border: 1px solid #E0CC99; }
          .doc-title { font-size: 22px; font-weight: bold; color: #7C4C26; margin: 0; letter-spacing: -0.5px; }
          .doc-subtitle { font-size: 13px; color: #633A10; margin-top: 6px; font-weight: 500; }
          .badge { background: #7C4C26; color: white; padding: 6px 14px; border-radius: 20px; font-weight: 600; font-size: 12px; }
          .qa-container { display: flex; flex-direction: column; gap: 14px; }
          .qa-item { padding: 15px 18px; border-radius: 8px; page-break-inside: avoid; box-shadow: 0 1px 3px rgba(124,76,38,0.04); }
          .q-title { font-weight: 700; font-size: 12px; color: #7C4C26; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.4px; }
          .a-text { font-size: 13px; color: #2D1A0A; white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
          .footer { margin-top: 30px; font-size: 11px; color: #7C4C26; text-align: center; border-top: 2px solid #E0CC99; padding-top: 15px; font-weight: 500; }
          @media print {
            body { background: white; padding: 0; }
            .no-print { display: none !important; }
            .qa-item { box-shadow: none; border: 1px solid #7C4C26; }
          }
        </style>
      </head>
      <body>
        <div class="no-print">
          <span style="font-weight: 600; color: #7C4C26; font-size: 14px;">Fiche Individuelle: ${escapeHtml(displayName)}</span>
          <button onclick="window.print()" style="background: #7C4C26; color: white; border: none; padding: 10px 22px; font-size: 13px; font-weight: bold; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 8px;">Enregistrer au format PDF / Imprimer</button>
        </div>

        <div class="doc-header">
          <div>
            <h1 class="doc-title">${escapeHtml(personName ? 'Fiche de : ' + personName : 'Fiche Individuelle de Réponse')}</h1>
            <div class="doc-subtitle">Nom complet: <strong>${escapeHtml(personName || 'Non renseigné')}</strong> | Bureau Kanaga: <strong>${escapeHtml(bureauVal)}</strong> | Ligne #${item.rowIndex} ${hideEmpty ? '<span style="color:#ef4444; margin-left:10px;">(Masqué si non renseigné)</span>' : ''}</div>
          </div>
          <div>
            <span class="badge">${escapeHtml(bureauVal)}</span>
          </div>
        </div>

        <div class="qa-container">
          ${qaPairsHtml || '<p style="color: #a0aec0; font-style: italic;">Toutes les questions sont non renseignées.</p>'}
        </div>

        <div class="footer">
          Document officiel généré le ${dateStr} via Portail Kanaga Consulting
        </div>
      </body>
      </html>
    `;

    printWin.document.open();
    printWin.document.write(htmlContent);
    printWin.document.close();
    setTimeout(() => {
      try {
        printWin.focus();
        printWin.print();
      } catch(e) {}
    }, 500);
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

</script>
