<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: Arial, sans-serif; margin: 20px; }
      label { display: block; margin-top: 15px; font-weight: bold; }
      input[type="text"], select, textarea {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box; /* Important */
      }
      textarea { height: 150px; }
      button {
        background-color: #4CAF50;
        color: white;
        padding: 10px 15px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        margin-top: 20px;
      }
      #cancel { background-color: #f44336; }
      #status { margin-top: 15px; font-weight: bold; color: green; }
    </style>
  </head>
  <body>
    <h2>ParamÃ¨tres du Rappel Admin (EntrÃ©es en attente)</h2>
    <p>Ce rappel vÃ©rifie les entrÃ©es de la semaine derniÃ¨re dans "Staging Data" et envoie une liste des utilisateurs Ã  un admin.</p>

    <form id="settings-form">
      <label for="activation">Activer ce rappel ?</label>
      <select id="activation" name="activation">
        <option value="OUI">OUI</option>
        <option value="NON">NON</option>
      </select>

      <label for="destinataire">Destinataire(s) Admin (sÃ©parÃ©s par une virgule)</label>
      <input type="text" id="destinataire" name="destinataire">

      <label for="sujet">Sujet de l'e-mail</label>
      <input type="text" id="sujet" name="sujet">

      <label for="message">Message (utilisez {liste_utilisateurs} pour insÃ©rer la liste)</label>
      <textarea id="message" name="message"></textarea>

      <button type="submit">Enregistrer</button>
      <button type="button" id="cancel">Annuler</button>
      <div id="status"></div>
    </form>

    <script>
      // 1. On load, fetch current settings
      window.addEventListener('load', function() {
        document.getElementById('status').innerText = "Chargement...";
        google.script.run
          .withSuccessHandler(populateForm)
          .withFailureHandler(showError)
          .getAdminReminderSettings(); // <-- Calls the admin settings function
      });

      // 2. Fill the form with data from the server
      function populateForm(settings) {
        document.getElementById('activation').value = settings.activation;
        document.getElementById('destinataire').value = settings.destinataire;
        document.getElementById('sujet').value = settings.sujet;
        document.getElementById('message').value = settings.message;
        document.getElementById('status').innerText = "";
      }

      // 3. Handle the form submission
      document.getElementById('settings-form').addEventListener('submit', function(e) {
        e.preventDefault();
        document.getElementById('status').innerText = "Enregistrement...";
        var settings = {
          activation: document.getElementById('activation').value,
          destinataire: document.getElementById('destinataire').value,
          sujet: document.getElementById('sujet').value,
          message: document.getElementById('message').value
        };
        google.script.run
          .withSuccessHandler(onSaveSuccess)
          .withFailureHandler(showError)
          .saveAdminReminderSettings(settings); // <-- Saves the admin settings
      });
      
      // 4. Close button
      document.getElementById('cancel').addEventListener('click', function() {
        google.script.host.close();
      });

      // 5. Success/Error helpers
      function onSaveSuccess() {
        document.getElementById('status').innerText = "ParamÃ¨tres enregistrÃ©s !";
        setTimeout(function() {
          google.script.host.close();
        }, 1500);
      }

      function showError(error) {
        document.getElementById('status').innerText = "Erreur: " + error.message;
        document.getElementById('status').style.color = "red";
      }
    </script>
  </body>
</html>
