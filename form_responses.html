<div class="view-header">
  <h2>Réponses au Formulaire</h2>
  <p>Consultez et filtrez les réponses enregistrées selon votre bureau Kanaga ou votre niveau d'accès.</p>
</div>

<div class="panel" style="margin-bottom: 20px;">
  <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 15px;">
    <!-- Search & Filters -->
    <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center; flex: 1; min-width: 280px;">
      <div style="position: relative; flex: 1; min-width: 200px;">
        <input type="text" id="responses-search-input" class="form-control" placeholder="Rechercher dans les réponses..." oninput="handleResponsesSearch()" style="padding-left: 35px;" />
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #888;">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </div>

      <div id="bureau-filter-container" style="display: none;">
        <select id="responses-bureau-select" class="form-control" onchange="handleBureauFilterChange()" style="min-width: 180px;">
          <option value="ALL">Tous les bureaux</option>
        </select>
      </div>
    </div>

    <!-- Actions -->
    <div style="display: flex; gap: 10px; align-items: center;">
      <span id="responses-count-badge" class="badge" style="background: var(--primary-color); font-size: 13px; padding: 6px 12px;">0 réponses</span>
      <button class="btn btn-outline btn-sm" onclick="loadFormResponsesData()">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px; vertical-align: middle;"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
        Actualiser
      </button>
      <button class="btn btn-primary btn-sm" onclick="exportResponsesToPDF()">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px; vertical-align: middle;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        Exporter PDF
      </button>
    </div>
  </div>
  <div style="display: flex; align-items: center; gap: 8px; margin-top: 12px; padding-top: 10px; border-top: 1px dashed #e2e8f0;">
    <label style="font-size: 13px; color: #4a5568; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none;">
      <input type="checkbox" id="responses-hide-empty-pdf" style="width: 16px; height: 16px; accent-color: var(--primary-color);" />
      Masquer les questions non renseignées dans l'export PDF
    </label>
  </div>
</div>

<div class="panel">
  <div id="responses-loader" class="status-msg" style="color: var(--primary-color); text-align: center; padding: 30px;">
    <div class="spinner" style="width: 24px; height: 24px; border-width: 3px; display: inline-block; vertical-align: middle; margin-right: 10px;"></div>
    Chargement des réponses du formulaire...
  </div>

  <div id="responses-error-msg" class="status-msg" style="display: none; color: var(--danger-color); text-align: center; padding: 20px; background: #fff5f5; border-radius: 8px; border: 1px solid #fed7d7;"></div>

  <div class="table-responsive" id="responses-table-container" style="display: none; overflow-x: auto;">
    <table class="modern-table" id="responses-table" style="width: 100%;">
      <thead>
        <tr id="responses-table-header">
          <th>Horodateur</th>
          <th>Bureau Kanaga (Col AF)</th>
          <th>Détails</th>
        </tr>
      </thead>
      <tbody id="responses-table-body">
      </tbody>
    </table>
  </div>
</div>

<!-- Modal Détail d'une réponse -->
<div id="response-detail-modal" class="modal">
  <div class="modal-content" style="max-width: 800px; width: 90%; max-height: 85vh; display: flex; flex-direction: column;">
    <div class="modal-header">
      <h3 id="response-modal-title" style="margin: 0;">Détails de la Réponse</h3>
      <span class="close-button" onclick="closeResponseDetailModal()">&times;</span>
    </div>
    <div class="modal-body" id="response-modal-body" style="overflow-y: auto; flex: 1; padding: 20px;">
      <!-- Content populated dynamically -->
    </div>
    <div style="padding: 15px 20px; background: #f8f9fa; border-top: 1px solid #eee; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px;">
      <div style="display: flex; align-items: center; gap: 15px;">
        <button class="btn btn-primary btn-sm" onclick="exportSingleResponseToPDF()">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px; vertical-align: middle;"><path d="M6 9V2h12v7"></path><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
          Imprimer / Exporter PDF
        </button>
        <label style="font-size: 12px; color: #4a5568; display: inline-flex; align-items: center; gap: 5px; cursor: pointer; user-select: none;">
          <input type="checkbox" id="modal-hide-empty-pdf" style="width: 14px; height: 14px;" />
          Masquer les questions vides
        </label>
      </div>
      <button class="btn btn-outline" onclick="closeResponseDetailModal()">Fermer</button>
    </div>
  </div>
</div>
